<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo-teens.svg" type="image/svg+xml">
<title>دار مشكاة — نظام المتابعة</title>
<meta name="theme-color" content="#007baf">
<style>
:root{--c:#007baf;--cd:#005f87;--g:#b4d437;--gd:#9cb82e;--bg:#f4f7f6;--t:#333;--m:#777;--ln:#e6eaee;
--l1:#e74c3c;--l2:#f0932b;--l3:#f1c40f;--l4:#3498db;--l5:#27ae60;--no:#95a5a6;--ok:#1e8449;--warn:#a04000;--bad:#c0392b}
*{box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--t);margin:0;-webkit-tap-highlight-color:transparent}
.hdr{background:linear-gradient(135deg,var(--c) 0%,var(--cd) 100%);height:150px;border-radius:0 0 36px 36px;position:absolute;top:0;left:0;right:0;z-index:-1}
.wrap{padding:16px 14px 60px;max-width:720px;margin:44px auto 0}
.card{background:#fff;border-radius:16px;padding:22px 18px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.08)}
.logos{background:#fff;border-radius:18px;margin:-70px auto 14px;padding:12px 18px;box-shadow:0 4px 15px rgba(0,0,0,.1);display:inline-flex;align-items:center;gap:18px}
.logos img{display:block}.logos .lt{height:74px}.logos .ld{height:42px}.logos .sep{width:1px;height:56px;background:var(--ln)}
.brand{background:#fff;border-radius:10px;padding:4px 8px;display:inline-flex;align-items:center}.brand img{height:30px;display:block}
h2{color:var(--c);margin:0 0 4px;font-size:21px}h3{color:var(--c);margin:0 0 10px;font-size:16px}
.sub{color:var(--m);font-size:13.5px;margin:0 0 16px}
.f{text-align:right;margin-bottom:12px}.lb{display:block;font-weight:600;margin-bottom:5px;color:var(--c);font-size:13.5px}
input[type=text],input[type=date],input[type=email],select,textarea{width:100%;padding:11px;border:2px solid #eef1f5;border-radius:10px;font-size:16px;background:#f9fbfd;font-family:inherit}
textarea{min-height:60px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--g);background:#fff;outline:none}
.btn{background:linear-gradient(135deg,var(--g) 0%,var(--gd) 100%);color:#fff;border:none;padding:13px 16px;font-size:16px;font-weight:bold;border-radius:10px;cursor:pointer;width:100%;font-family:inherit}
.btn:disabled{opacity:.6;cursor:default}.btn.sec{background:#fff;color:var(--c);border:2px solid var(--c)}.btn.sm{width:auto;padding:7px 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--c);border:none;padding:6px 8px;font-size:13px;width:auto;text-decoration:underline}
.msg{display:none;margin-top:10px;padding:10px;border-radius:8px;font-weight:bold;background:#fdecea;color:var(--bad)}.msg.show{display:block}
.hidden{display:none!important}
.top{color:#fff;margin:-30px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h2{color:#fff;font-size:18px;margin:0}.top .s{font-size:12.5px;opacity:.9}
.top button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:7px 10px;font-family:inherit;cursor:pointer}
.tabs{display:flex;gap:6px;background:#fff;padding:6px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:12px}
.tabs button{flex:1;border:none;background:transparent;padding:10px 4px;border-radius:10px;font-family:inherit;font-size:14px;color:#555;cursor:pointer}
.tabs button.on{background:var(--c);color:#fff;font-weight:bold}
.panel{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:12px;text-align:right}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;background:#eef1f5;color:#555}
.pill.ok{background:#d5f5e3;color:var(--ok)}.pill.no{background:#fdecea;color:var(--bad)}.pill.wait{background:#fde3c8;color:var(--warn)}.pill.c{background:#e3f1f8;color:var(--c)}
.line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px}.line .k{color:var(--m);min-width:62px}
.cls{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:right;border-right:5px solid var(--no);cursor:pointer}
.cls.ok{border-right-color:var(--l5)}.cls.warn{border-right-color:var(--l2)}.cls.late{border-right-color:var(--l1)}
.cls h4{margin:0;color:var(--c);font-size:15.5px}.cls .m{font-size:12.5px;color:var(--m);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:11px 6px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.stat b{display:block;font-size:21px;color:var(--c);font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--m)}
.st{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:right}
.st.done{box-shadow:0 0 0 2px var(--l5) inset}
.st-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.st-h b{font-size:15px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{flex:1 1 17%;min-width:56px;padding:8px 3px;font-size:13px;border:2px solid var(--ln);border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;color:#555}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}.chip.on.absent{background:var(--l1);border-color:var(--l1)}
.crit{margin-top:7px}.crit-r{display:flex;align-items:center;gap:6px}.crit-t{font-size:13px;font-weight:600;color:#444;width:62px;flex:0 0 62px}
.lv{display:flex;gap:4px;flex:1}
.lv button{flex:1;border:2px solid var(--ln);border-radius:9px;background:#f9fbfd;cursor:pointer;font-family:inherit;color:#555;padding:7px 0;font-size:15px;font-weight:bold;min-width:0}
.lv button.na{flex:1.7;font-size:11px;font-weight:normal;line-height:1.1}
.lv button.on[data-v="1"]{background:var(--l1);border-color:var(--l1);color:#fff}.lv button.on[data-v="2"]{background:var(--l2);border-color:var(--l2);color:#fff}
.lv button.on[data-v="3"]{background:var(--l3);border-color:var(--l3);color:#333}.lv button.on[data-v="4"]{background:var(--l4);border-color:var(--l4);color:#fff}
.lv button.on[data-v="5"]{background:var(--l5);border-color:var(--l5);color:#fff}.lv button.on.na{background:var(--no);border-color:var(--no);color:#fff}
.desc{font-size:12px;color:var(--m);margin:2px 68px 0 0;min-height:0}
.scl{font-size:12px;color:var(--m);margin:2px 68px 0 0}.scl summary{cursor:pointer;color:var(--c);list-style:none;display:inline-block}.scl summary::-webkit-details-marker{display:none}.scl div{padding:2px 0}.scl b{display:inline-block;width:16px;color:#444}
.grp{font-size:12px;color:var(--c);font-weight:bold;margin-top:10px;border-top:1px dashed var(--ln);padding-top:6px}
.fu{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.fu button{border:2px solid var(--ln);background:#fff;border-radius:20px;padding:5px 10px;font-family:inherit;font-size:12.5px;cursor:pointer;color:#555}
.fu button.y{background:#d5f5e3;border-color:var(--l5);color:var(--ok)}.fu button.n{background:#fdecea;border-color:var(--l1);color:var(--bad)}
.note{font-size:13px;background:#f6f9fc;border-radius:10px;padding:8px 10px;margin-top:6px}.note small{color:var(--m)}
.info{background:#f6f9fc;border:1px solid #e3ebf2;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;text-align:right}
.info b{color:var(--c)}.info summary{cursor:pointer;color:var(--c);font-weight:bold}
.task{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:14px}.task .tc{display:flex;gap:5px}
.task button{border:2px solid var(--ln);background:#fff;border-radius:9px;padding:6px 10px;font-family:inherit;cursor:pointer;font-size:13px}
.task button.on.y{background:var(--l5);border-color:var(--l5);color:#fff}.task button.on.n{background:var(--l2);border-color:var(--l2);color:#fff}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}.bar .nm{width:62px}.bar .tr{flex:1;height:10px;background:#eef1f5;border-radius:10px;overflow:hidden}
.bar .fl{height:100%;border-radius:10px;background:var(--c)}.bar .vl{width:58px;text-align:left;font-weight:bold;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap}th{color:var(--m);font-weight:600}
.tw{overflow-x:auto}td.ed{cursor:pointer;text-decoration:underline dotted}
.s1{color:var(--l1);font-weight:bold}.s2{color:var(--l2);font-weight:bold}.s3{color:#b7950b;font-weight:bold}.s4{color:var(--l4);font-weight:bold}.s5{color:var(--l5);font-weight:bold}
.empty{color:var(--m);font-size:13.5px;text-align:center;padding:12px}.loading{text-align:center;color:var(--m);padding:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92%;text-align:center}
.toast.show{opacity:.95}
.sticky{position:sticky;bottom:10px;z-index:5}
.back{background:rgba(255,255,255,.95);border:none;color:var(--c);font-family:inherit;font-size:13.5px;cursor:pointer;padding:6px 12px;margin-bottom:8px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chk{display:flex;flex-wrap:wrap;gap:6px}.chk label{border:2px solid var(--ln);border-radius:20px;padding:5px 10px;font-size:13px;cursor:pointer}.chk input{display:none}
.chk label.on{background:var(--c);color:#fff;border-color:var(--c)}
.ur{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}.ur.off{opacity:.5}
</style>
</head>
<body>
<div class="hdr" id="hdr"></div>
<div class="wrap">
  <div class="card" id="v-login">
    <div class="logos"><img class="ld" src="logo-dar.svg" alt="دار مشكاة"><span class="sep"></span><img class="lt" src="logo-teens.svg" alt="مشكاة Teens"></div>
    <h2>نظام المتابعة</h2>
    <p class="sub">بوابة المتابعة — المربين والمنسقين والإدارة</p>
    <div class="f"><label class="lb" for="code">الكود:</label><input type="text" id="code" inputmode="numeric" autocomplete="off" placeholder="الكود الخاص بيك"></div>
    <button class="btn" id="login-btn" type="button">دخول 🚀</button>
    <div class="msg" id="login-msg"></div>
  </div>
  <div class="hidden" id="v-app">
    <div class="top"><div style="display:flex;align-items:center;gap:10px"><span class="brand" id="brand"></span><div><h2 id="hello"></h2><div class="s" id="hello-s"></div></div></div>
      <div><button type="button" id="snd" title="الأصوات">🔊</button> <button type="button" id="out">خروج</button></div></div>
    <div class="tabs" id="tabs"></div>
    <div id="main"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxMaU2MpXEFYy2rHQOLLWH_9wAHpfthVP5zTXWCN6QgVHxBD-50BVQ3KeydDspvrzGorw/exec';
var LOGOS = { teens: 'logo-teens.svg', dar: 'logo-dar.svg' };
var ME = null, VIEW = '', ST = {};
var VIEWS = { coach: '📋 مجموعاتي', follow: '📊 المتابعة', admin: '⚙️ الأدمن' };

// ---------- أصوات ----------
var Sound = { ctx: null, on: true,
  play: function (k) { if (!this.on) return; try {
    if (!this.ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    var c = this.ctx, seq = { tap: [660], ok: [523, 659, 784, 1047], err: [250, 190], lv: [392 + 40 * (Number(k.slice(2)) || 0)] }[k.indexOf('lv') === 0 ? 'lv' : k] || [660];
    seq.forEach(function (f, i) { var t = c.currentTime + i * 0.1, o = c.createOscillator(), g = c.createGain();
      o.type = k === 'err' ? 'square' : 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(k === 'err' ? 0.05 : 0.14, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.2); }); } catch (e) {} } };

// ---------- أدوات ----------
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var tt; function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { e.classList.remove('show'); }, 3000); }
function busy(b, t) { if (!b) return; if (!b.dataset.l) b.dataset.l = b.textContent; b.disabled = !!t; b.textContent = t || b.dataset.l; }
function call(fn, args, ok, fail) {
  fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { return r.json(); })
    .then(function (r) { if (r.ok) ok(r.data); else (fail || failed)(new Error(r.error)); })
    .catch(function () { (fail || failed)(new Error('تعذر الاتصال، اتأكد من الإنترنت وجرب تاني')); });
}
function failed(e) { Sound.play('err'); toast('⚠️ ' + e.message); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function sc(v) { var n = Number(v); return n >= 1 && n <= 5 ? '<span class="s' + n + '">' + n + '</span>' : (v ? '<small>' + esc(v === 'لم يُلاحظ' ? 'ل' : v) + '</small>' : '—'); }
function opts(list, cur, ph) { return (ph ? '<option value="">' + ph + '</option>' : '') + list.map(function (x) { var v = typeof x === 'object' ? x.v : x, l = typeof x === 'object' ? x.l : x; return '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join(''); }
function main(h) { $('main').innerHTML = h; window.scrollTo(0, 0); }
function loading() { main('<div class="panel loading">جاري التحميل…</div>'); }

// ---------- هوية القسم ----------
var BRANDS = { teens: { name: 'مشكاة Teens', color: '#007baf' }, dar: { name: 'دار مشكاة', color: '#1b95cc' } };
function brand(sec) {
  sec = sec || (ME && ME.sections && ME.sections[0] && ME.sections[0].code);
  var s = BRANDS[sec] ? { code: sec, name: BRANDS[sec].name, color: BRANDS[sec].color } : (ME && ME.sections || []).filter(function (x) { return x.code === sec; })[0];
  var color = s && s.color ? s.color : '#007baf';
  document.documentElement.style.setProperty('--c', color);
  document.documentElement.style.setProperty('--cd', shade(color));
  $('hello-s').textContent = s ? s.name : '';
  var logo = s ? (LOGOS[s.code] || (/^https?:/.test(s.logo || '') ? s.logo : '')) : '';
  $('brand').innerHTML = logo ? '<img src="' + esc(logo) + '" alt="' + esc(s.name) + '">' : '';
  $('brand').classList.toggle('hidden', !logo);
}
function shade(hex) { var n = parseInt(hex.slice(1), 16), r = (n >> 16) * .75, g = (n >> 8 & 255) * .75, b = (n & 255) * .75;
  return '#' + [r, g, b].map(function (x) { return ('0' + Math.round(x).toString(16)).slice(-2); }).join(''); }

// ---------- الدخول ----------
function login(silent) {
  var code = $('code').value.trim(), msg = $('login-msg');
  if (!code) { if (!silent) { msg.textContent = 'اكتب الكود'; msg.classList.add('show'); Sound.play('err'); } return; }
  var b = $('login-btn'); busy(b, 'جاري التحقق… ⏳'); msg.classList.remove('show');
  call('login', [code], function (r) {
    busy(b);
    if (!r.success) { store('mk_code', null); msg.textContent = r.message; msg.classList.add('show'); Sound.play('err'); return; }
    ME = r; store('mk_code', code); Sound.play('ok');
    $('hello').textContent = 'أهلاً، ' + r.name;
    $('v-login').classList.add('hidden'); $('v-app').classList.remove('hidden');
    $('tabs').innerHTML = r.views.map(function (v) { return '<button type="button" data-v="' + v + '">' + VIEWS[v] + '</button>'; }).join('');
    $('tabs').classList.toggle('hidden', r.views.length < 2);
    brand(r.sections[0] && r.sections[0].code);
    if (!r.views.length) { main('<div class="panel empty">حسابك ملوش صلاحيات لسه — كلّم الأدمن.</div>'); return; }
    go(r.views[0]);
  }, function (e) { busy(b); msg.textContent = e.message; msg.classList.add('show'); Sound.play('err'); });
}
function logout() { ME = null; store('mk_code', null); $('code').value = ''; $('v-app').classList.add('hidden'); $('v-login').classList.remove('hidden'); }
function go(v) {
  VIEW = v;
  [].forEach.call($('tabs').children, function (b) { b.classList.toggle('on', b.dataset.v === v); });
  if (v === 'coach') coachHome(); else if (v === 'follow') followHome(0); else if (v === 'admin') adminHome();
}

// ======================================================================
//                               المربي
// ======================================================================
function coachHome() {
  var cs = ME.classes;
  main('<div class="panel"><h3>📋 مجموعاتي</h3>' + (cs.length ? cs.map(function (c) {
      return '<div class="cls ok" data-cls="' + esc(c.name) + '"><h4>' + esc(c.name) + '</h4><div class="m">' + esc(c.program) + ' • ' + esc(c.level || '') +
        (c.hasTerm ? ' • ' + esc(c.term) : ' • <span class="pill wait">مفيش ترم حالي</span>') + '</div></div>';
    }).join('') : '<div class="empty">مفيش مجموعات مسجلة باسمك.</div>') +
    '<button class="btn sec" type="button" id="sub-btn">🔁 أنا مربي بديل النهارده</button></div><div id="sub-list"></div>');
  $('main').onclick = function (e) {
    var c = e.target.closest('[data-cls]'); if (c) { Sound.play('tap'); openSession(c.dataset.cls, null, c.dataset.sub === '1'); return; }
    if (e.target.id === 'sub-btn') {
      $('sub-list').innerHTML = '<div class="panel loading">جاري التحميل…</div>';
      call('substituteClasses', [ME.code], function (list) {
        $('sub-list').innerHTML = '<div class="panel"><h3>اختار المجموعة اللي هتغطيها</h3>' + (list.length ? list.map(function (c) {
          return '<div class="cls" data-cls="' + esc(c.name) + '" data-sub="1"><h4>' + esc(c.name) + '</h4><div class="m">' + esc(c.program) + ' • ' + esc(c.level || '') + '</div></div>'; }).join('')
          : '<div class="empty">مفيش مجموعات تانية في فرعك.</div>') + '</div>';
      });
    }
  };
}

function openSession(cls, n, sub) {
  loading();
  call('getSession', [ME.code, cls, n, !!sub], function (r) { ST = { s: r, sub: !!sub, rows: {}, guests: [], tasks: {}, date: r.today }; brand(r.section);
    if (!r.readonly) r.students.forEach(function (s) { var p = (r.projectStatus || {})[s.code] || {};
      ST.rows[s.code] = { code: s.code, att: 'حاضر', scores: {}, follow: {}, notes: '', behavior: '', project: { status: p.status || '', scores: Object.assign({}, p.scores || {}) } }; });
    renderSession(); }, function (e) { failed(e); coachHome(); });
}

function sessionLabel(s) {
  var st = { done: '✅', cancelled: '🚫', open: '', future: '⏳' }[s.status];
  return 'حلقة ' + s.n + ' — أسبوع ' + s.week + (s.mid ? ' • ميد' : '') + (s.final ? ' • فاينال' : '') + ' ' + st;
}

function renderSession() {
  var r = ST.s, s = r.session;
  var head = '<button class="back" type="button" data-act="home">→ رجوع لمجموعاتي</button>' +
    '<div class="panel"><div class="row"><div><h3 style="margin:0">' + esc(r.cls) + (r.mode === 'بديل' ? ' <span class="pill wait">بديل</span>' : '') + '</h3>' +
    '<div class="sub" style="margin:2px 0 0">' + esc(r.program) + ' • ' + esc(r.level || '') + ' • ' + esc(r.term.name) + '</div></div>' +
    '<button class="btn sm sec" type="button" data-act="history" style="flex:0 0 auto">🗂️ تقييماتي السابقة</button></div>' +
    '<div class="row" style="margin-top:8px"><button class="btn sm' + (s.mid || s.final ? '' : ' sec') + '" type="button" data-act="exam">📝 الميد / الفاينال</button><button class="btn sm sec" type="button" data-act="self">🙋 التقييم الذاتي</button></div>' +

function scaleOf(key, band) { var s = ME.scales || {}; return s[key + '|' + (band || '')] || s[key + '|'] || null; }

  return '<div class="crit"><div class="crit-r"><div class="crit-t">' + esc(c.name) + '</div><div class="lv">' + lv + '</div></div>' + (d ? '<div class="desc">' + esc(d) + '</div>' : '') + allLv(c.levels) + '</div>';
}

function critsFor(st) { var b = ST.s.criteriaByBand || {}; return b[st.band] || ST.s.criteria; }
function ageHTML(st) {

  var h = '<button type="button" class="pill ' + (st.ageEstimated || !st.age ? 'wait' : 'c') + '" data-act="age" data-s="' + esc(st.code) + '" style="border:none;cursor:pointer;font-family:inherit">👶 ' + lbl + '</button>';
  if (ST.openAge === st.code && a) h += '<div class="info" style="margin:8px 0 0"><b>سن ' + esc(a.ages) + '</b>' + (st.ageEstimated ? ' — تاريخ الميلاد مش متسجل، فالأوصاف مؤقتًا على السن المعتاد للمستوى (المنسق يسجّله)' : '') +
    '<p><b>معرفيًا:</b> ' + esc(a.cognitive) + '</p><p><b>اجتماعيًا ووجدانيًا:</b> ' + esc(a.social) + '</p><p><b>القياس:</b> ' + esc(a.measure) + '</p></div>';
  return h;
}
function studentHTML(st, guest) {

  var h = '<div class="st' + (complete ? ' done' : '') + '" data-st="' + esc(st.code) + '"><div class="st-h"><b>' + esc(st.name) + '</b><span>' +

  if (!guest) h += '<div class="chips">' + ME.attendance.map(function (a) { return '<button type="button" class="chip' + (row.att === a ? ' on' + (ME.rated.indexOf(a) === -1 ? ' absent' : '') : '') + '" data-act="att" data-s="' + esc(st.code) + '" data-v="' + a + '">' + a + '</button>'; }).join('') + '</div>';
  if (rated || guest) {

    h += '<div class="fu">' + (ST.s.session.family ? ME.followups : []).map(function (f) { var v = row.follow[f[0]]; return '<button type="button" data-act="fu" data-s="' + esc(st.code) + '" data-f="' + f[0] + '" class="' + (v === 'تم' ? 'y' : v === 'لم يتم' ? 'n' : '') + '">' + (v === 'تم' ? '✓ ' : v === 'لم يتم' ? '✗ ' : '') + f[1] + '</button>'; }).join('') +
      '<button type="button" data-act="beh" data-s="' + esc(st.code) + '" class="' + (row.behavior ? 'n' : '') + '">⚑ ملاحظة سلوكية</button></div>';
    if (row.behavior !== '' || row._showBeh) h += '<div class="f" style="margin-top:6px"><input type="text" data-in="behavior" data-s="' + esc(st.code) + '" value="' + esc(row.behavior) + '" placeholder="الموقف باختصار (بيوصل لأخصائي السلوك لو اتكرر)"></div>';

function isComplete(row) {
  if (!row.att) return false;
  if (ME.rated.indexOf(row.att) === -1) return projDone(row);
  return ST.s.criteria.every(function (c) { return row.scores[c.key] !== undefined && row.scores[c.key] !== ''; }) && projDone(row);
}
function projDone(row) { if (!ST.s.project || row._guest) return true; var p = row.project; if (!p.status) return false;
  return p.status !== 'سلّم' || ME.projectDims.every(function (d) { return !!p.scores[d[0]]; }); }

function rowOf(code) { return ST.rows[code] || ST.guests.filter(function (g) { return g.code === code; })[0]; }

function bindSession() {
  var m = $('main');
  m.onclick = function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act, row = b.dataset.s ? rowOf(b.dataset.s) : null;
    if (a === 'home') { coachHome(); return; }
    if (a === 'history') { history(); return; }
    if (a === 'exam' || a === 'self') { var rc = ST.s.cls, rs = ST.sub, bk = function () { openSession(rc, null, rs); };
      if (a === 'exam') openExam(rc, '', bk, rs); else openSelf(rc, '', bk, rs); return; }
    if (a === 'att') { row.att = b.dataset.v; }
    else if (a === 'age') { ST.openAge = ST.openAge === b.dataset.s ? null : b.dataset.s; }
    else if (a === 'score') { row.scores[b.dataset.c] = b.dataset.v === 'na' ? ME.notObserved : Number(b.dataset.v); Sound.play(b.dataset.v === 'na' ? 'tap' : 'lv' + b.dataset.v); updateStudent(b.dataset.s); return; }
    else if (a === 'fu') { var cur = row.follow[b.dataset.f]; row.follow[b.dataset.f] = cur === 'تم' ? 'لم يتم' : cur === 'لم يتم' ? '' : 'تم'; }
    else if (a === 'beh') { row._showBeh = !row._showBeh || !!row.behavior; }
    else if (a === 'pst') { row.project.status = b.dataset.v; }
    else if (a === 'psc') { row.project.scores[b.dataset.c] = Number(b.dataset.v); }
    else if (a === 'task') { ST.tasks[b.dataset.t] = b.dataset.v; Sound.play('tap'); keepScroll(renderSession); return; }
    else if (a === 'guest') { guestBox(); return; }
    else if (a === 'newst') { newStudent(); return; }
    else if (a === 'addguest') { addGuest(b.dataset.code, b.dataset.name, b.dataset.cls, b.dataset.age, b.dataset.band); return; }
    else if (a === 'save') { save(); return; }
    else if (a === 'confirm-tasks') { confirmTasks(); return; }
    else if (a === 'ptask') { ST.ptasks[b.dataset.t] = 'تم'; b.classList.add('on'); return; }
    else return;
    Sound.play('tap'); updateStudent(b.dataset.s);
  };
  m.oninput = function (e) { var el = e.target; if (el.dataset.in) { rowOf(el.dataset.s)[el.dataset.in] = el.value; }
    if (el.id === 'sdate') ST.date = el.value; };
  m.onchange = function (e) { if (e.target.id === 'sess') { var r = ST.s; openSession(r.cls, Number(e.target.value), ST.sub); }
    if (e.target.id === 'gq') findGuest(e.target.value); };
}
function keepScroll(fn) { var y = window.scrollY; fn(); window.scrollTo(0, y); }

}

function save() {
  var r = ST.s, all = r.students.map(function (s) { return ST.rows[s.code]; }).concat(ST.guests);
  var miss = all.filter(function (x) { return !isComplete(x); })[0];

  var t = ME.tasks.filter(function (x) { return !ST.tasks[x[0]]; })[0];

    var list = d.classes, sessions = [], late = 0, pend = 0, present = 0, total = 0;

      '<div class="f" style="margin:0"><label class="lb">مقيّم القرآن:</label><select data-in="quranEval" data-s="' + esc(st.code) + '">' + opts(d.evaluators, r.quranEval) + '</select></div></div>';
  }
  h += '<div class="f" style="margin:6px 0 0"><textarea data-in="notes" data-s="' + esc(st.code) + '" placeholder="ملاحظات (اختياري)">' + esc(r.notes) + '</textarea></div>' +
    '<button class="btn" type="button" data-x="save" data-s="' + esc(st.code) + '" style="margin-top:8px">' + (sv ? 'حفظ التعديل ✏️' : 'حفظ اختبار ' + esc(st.name) + ' ✅') + '</button>';
  return h + '</div>';
}
function examSavedHTML(sv, b) {
  if (sv.att !== 'حاضر') return '<div class="sub" style="margin:8px 0 0">' + esc(sv.att) + ' — سجّله ' + esc(sv.by) + '</div>';
  var h = '<div class="line"><span class="k">الأسئلة</span>' + sv.q.filter(function (v) { return v !== '' && v != null; }).map(sc).join(' ') + '</div>' +
    '<div class="line"><span class="k">القرآن</span>' + quranCrit(b).map(function (c) { return '<span class="pill">' + esc(c.name) + ' ' + sc(sv[c.key]) + '</span>'; }).join('') + '</div>' +
    '<div class="line"><span class="k">المجالات</span>' + b.domains.map(function (g) { return '<span class="pill">' + esc(g.name) + ' ' + sc(sv.g[g.key]) + '</span>'; }).join('') + '</div>';
  return h + '<div class="sub" style="margin:6px 0 0">مقيّم المحتوى: ' + esc(sv.contentEval) + ' • مقيّم القرآن: ' + esc(sv.quranEval) + ' • سجّله ' + esc(sv.by) + '</div>' +
    (sv.notes ? '<div class="note">' + esc(sv.notes) + '</div>' : '') + '<div class="sub" style="margin:6px 0 0">الاختبار اتسجل — لو في غلط اطلب من المنسق يعدّله.</div>';
}
function fillExam(r, sv) {
  r.att = sv.att || 'حاضر'; r.q = (sv.q || []).map(function (v) { return Number(v) || undefined; });
  ['hifz', 'tajweed', 'maani'].forEach(function (k) { if (Number(sv[k])) r[k] = Number(sv[k]); });
  r.g = Object.assign({}, sv.g || {}); r.contentEval = sv.contentEval || r.contentEval; r.quranEval = sv.quranEval || r.quranEval; r.notes = sv.notes || ''; r._loaded = true;
}
function updateExamStudent(code) {
  var el = document.querySelector('.st[data-st="' + CSS.escape(code) + '"]'); if (!el) return;
  var st = ST.ex.d.students.filter(function (s) { return s.code === code; })[0];
  var t = document.createElement('div'); t.innerHTML = examStudentHTML(st); el.replaceWith(t.firstChild);
}
function bindExam() {
  var m = $('main'), x = ST.ex;
  m.onclick = function (e) {
    var b = e.target.closest('[data-x]'); if (!b) return;
    var a = b.dataset.x, code = b.dataset.s, r = code ? x.rows[code] : null;
    if (a === 'back') { ST.exBack(); return; }
    if (a === 'open') { x.open = x.open === code ? null : code; if (x.open && x.d.saved[code] && x.d.canEdit && !r._loaded) fillExam(r, x.d.saved[code]);
      Sound.play('tap'); keepScroll(renderExam); if (x.open) scrollToSt(code); return; }
    if (a === 'save') { saveExamRow(code, b); return; }
    if (a === 'att') r.att = b.dataset.v;
    else if (a === 'eq') r.q[Number(b.dataset.k)] = Number(b.dataset.v);
    else if (a === 'eqr') r[b.dataset.k] = Number(b.dataset.v);
    else if (a === 'eg') r.g[b.dataset.k] = Number(b.dataset.v);
    else return;
    Sound.play(/^[1-5]$/.test(b.dataset.v) ? 'lv' + b.dataset.v : 'tap'); updateExamStudent(code);
  };
  m.oninput = function (e) { var el = e.target; if (el.dataset.in && el.dataset.s) x.rows[el.dataset.s][el.dataset.in] = el.value; };
  m.onchange = function (e) { var el = e.target; if (el.id === 'exsel') openExam(x.d.cls, el.value); else if (el.dataset.in && el.dataset.s) x.rows[el.dataset.s][el.dataset.in] = el.value; };
}
function saveExamRow(code, btn) {
  var x = ST.ex, d = x.d, r = x.rows[code], st = d.students.filter(function (s) { return s.code === code; })[0], b = d.bands[st.band];
  if (r.att === 'حاضر') {
    var miss = [];
    for (var i = 0; i < d.tpl.questions; i++) if (!r.q[i]) miss.push('سؤال ' + (i + 1));
    quranCrit(b).forEach(function (c) { if (!r[c.key]) miss.push(c.name); });
    b.domains.forEach(function (g) { if (!r.g[g.key]) miss.push(g.name); });
    if (miss.length) { Sound.play('err'); toast('ناقص: ' + miss.join('، ')); return; }
  }
  var data = { att: r.att, q: r.q.slice(0, d.tpl.questions), hifz: r.hifz, tajweed: r.tajweed, maani: r.maani, g: r.g, contentEval: r.contentEval, quranEval: r.quranEval, notes: r.notes };
  busy(btn, 'جاري الحفظ… ⏳');
  call('saveExam', [ME.code, d.cls, d.exam, code, data, ST.exSub], function (res) {
    Sound.play('ok'); toast('اتحفظ ✅ ' + st.name + (res.total != null ? ' — ' + res.total + '٪' : ''));
    d.saved[code] = true; openExam(d.cls, d.exam, null, null, nextOpen(d.students, d.saved, code));
  }, function (e) { busy(btn); failed(e); });
}

// ---------- التقييم الذاتي ----------
function openSelf(cls, when, back, sub, openCode) {
  loading();
  if (back) { ST.exBack = back; ST.exSub = !!sub; }
  call('selfForm', [ME.code, cls, when || '', ST.exSub], function (d) {
    ST.sf = { d: d, rows: {}, open: openCode === undefined ? null : openCode };
    d.students.forEach(function (s) { var sv = d.saved[s.code]; ST.sf.rows[s.code] = { g: Object.assign({}, sv ? sv.g : {}), note: sv ? sv.note || '' : '' }; });
    renderSelf(); if (ST.sf.open) scrollToSt(ST.sf.open);
  }, function (e) { failed(e); ST.exBack(); });
}
function renderSelf() {
  var d = ST.sf.d, done = Object.keys(d.saved).length;
  var h = '<button class="back" type="button" data-x="back">→ رجوع</button><div class="panel"><div class="row"><div><h3 style="margin:0">🙋 تقييم الطالب لنفسه — ' + esc(d.cls) + '</h3>' +
    '<div class="sub" style="margin:2px 0 0">' + esc(d.term) + '</div></div><select id="sfsel" style="width:auto;flex:0 0 auto">' + opts(d.whens, d.when) + '</select></div>' +
    '<div class="line"><span class="pill ' + (done === d.students.length ? 'ok' : 'wait') + '">اتسجل ' + done + ' من ' + d.students.length + '</span></div>' +
    '<div class="info" style="margin:8px 0 0">الطالب مش بيدخل على السيستم. اسأله السؤال شفوي (أو على ورقة) وسجّل إنت إجابته هنا — مفيش إجابة صح وغلط، ماتقترحش عليه. الصغيرين (4–6) إجابتهم من 3 اختيارات بس.</div></div>';
  main(h + d.students.map(selfStudentHTML).join('')); bindSelf();
}
function selfStudentHTML(st) {
  var x = ST.sf, d = x.d, sv = d.saved[st.code], open = x.open === st.code, b = d.bands[st.band], r = x.rows[st.code];
  var h = '<div class="st' + (sv ? ' done' : '') + '" data-st="' + esc(st.code) + '">' + stHead(st, open, sv ? '<span class="pill ok">✅</span>' : '<span class="pill">لسه</span>');
  if (!open) return h + '</div>';
  b.domains.forEach(function (g) {
    h += '<div class="desc" style="margin-top:10px;font-weight:600;color:#333">' + esc(g.q) + '</div>';
    var sl = scaleOf('self', st.band);
    if (b.three) h += '<div class="lv" style="margin-top:4px">' + [1, 3, 5].map(function (v) { return '<button type="button" data-x="sg" data-s="' + esc(st.code) + '" data-k="' + esc(g.key) + '" data-v="' + v + '" class="' + (r.g[g.key] === v ? 'on' : '') + '" style="font-size:12.5px;font-weight:normal;padding:8px 2px">' + esc(sl && sl[v - 1] ? sl[v - 1] : v) + '</button>'; }).join('') + '</div>';
    else h += lvRow('', st.code, g.key, r.g[g.key], sl, 'sg', d.scale).replace('<div class="crit-t"></div>', '');
  });
  h += '<div class="f" style="margin:8px 0 0"><textarea data-in="note" data-s="' + esc(st.code) + '" placeholder="كلمة الطالب عن نفسه (اختياري)">' + esc(r.note) + '</textarea></div>' +
    '<button class="btn" type="button" data-x="save" data-s="' + esc(st.code) + '" style="margin-top:8px">' + (sv ? 'حفظ التعديل ✏️' : 'حفظ ✅') + '</button>';
  return h + '</div>';
}
function bindSelf() {
  var m = $('main'), x = ST.sf;
  m.onclick = function (e) {
    var b = e.target.closest('[data-x]'); if (!b) return;
    var a = b.dataset.x, code = b.dataset.s, r = code ? x.rows[code] : null;
    if (a === 'back') { ST.exBack(); return; }
    if (a === 'open') { x.open = x.open === code ? null : code; Sound.play('tap'); keepScroll(renderSelf); if (x.open) scrollToSt(code); return; }
    if (a === 'save') { saveSelfRow(code, b); return; }
    if (a === 'sg') { r.g[b.dataset.k] = Number(b.dataset.v); Sound.play('lv' + b.dataset.v);
      var el = document.querySelector('.st[data-st="' + CSS.escape(code) + '"]'), st = x.d.students.filter(function (s) { return s.code === code; })[0];
      var t = document.createElement('div'); t.innerHTML = selfStudentHTML(st); el.replaceWith(t.firstChild); }
  };
  m.oninput = function (e) { var el = e.target; if (el.dataset.in && el.dataset.s) x.rows[el.dataset.s][el.dataset.in] = el.value; };
  m.onchange = function (e) { if (e.target.id === 'sfsel') openSelf(x.d.cls, e.target.value); };
}
function saveSelfRow(code, btn) {
  var x = ST.sf, d = x.d, r = x.rows[code], st = d.students.filter(function (s) { return s.code === code; })[0], b = d.bands[st.band];
  var miss = b.domains.filter(function (g) { return !r.g[g.key]; });
  if (miss.length) { Sound.play('err'); toast('ناقص ' + miss.length + ' سؤال'); return; }
  busy(btn, 'جاري الحفظ… ⏳');
  call('saveSelf', [ME.code, d.cls, d.when, code, { g: r.g, note: r.note }, ST.exSub], function () {
    Sound.play('ok'); toast('اتحفظ ✅ ' + st.name); d.saved[code] = true; openSelf(d.cls, d.when, null, null, nextOpen(d.students, d.saved, code));
  }, function (e) { busy(btn); failed(e); });
}

// ---------- في التقرير ----------
function examReportHTML(x) {
  if (!x || (!x.exams.length && !x.selfCount)) return '';
  var h = '';
  if (x.exams.length) h += '<h3 style="margin-top:14px">📝 الاختبارات</h3><div class="line">' + x.exams.map(function (e) {
    return '<span class="pill ' + (e.att === 'حاضر' ? 'c' : 'wait') + '">' + esc(e.exam) + ': ' + (e.att === 'حاضر' ? (e.total == null ? '—' : '<bdi>' + e.total + '%</bdi>') : esc(e.att)) + '</span>'; }).join('') + '</div>';
  if (x.profile.some(function (p) { return p.coach != null || p.self != null; })) {
    h += '<h3 style="margin-top:14px">🌱 النمو: المربي مقابل الطالب</h3>' + x.profile.map(function (p) {
      var bar = function (v, c) { return '<div class="tr" style="height:7px;margin:2px 0"><div class="fl" style="width:' + (v ? v / 5 * 100 : 0) + '%;background:' + c + '"></div></div>'; };
      var gs = p.self != null && p.selfStart != null && x.selfCount > 1 ? p.self - p.selfStart : null;
      return '<div class="bar"><span class="nm">' + esc(p.name) + '</span><div style="flex:1">' + bar(p.coach, 'var(--c)') + bar(p.self, 'var(--l3)') + '</div><span class="vl">' +
        (p.coach == null ? '—' : p.coach) + ' / ' + (p.self == null ? '—' : p.self) + (gs ? ' <small style="color:' + (gs > 0 ? 'var(--l5)' : 'var(--l1)') + '">' + (gs > 0 ? '▲' : '▼') + Math.abs(gs) + '</small>' : '') + '</span></div>'; }).join('') +
      '<div class="sub">الأزرق = المربي (' + esc(x.profileFrom || 'لسه') + ')، الأصفر = الطالب في آخر تقييم ذاتي (▲▼ = تغيّره عن أول مرة). لو الفرق بينهم كبير، يستاهل كلام مع الطالب.</div>';
  }
  return h;
}

function adminHome() {
  loading();
  call('adminData', [ME.code], function (d) {
    ST.ad = d;
    main('<div class="panel"><div class="row"><h3 style="margin:0">👥 المستخدمين (' + d.users.length + ')</h3><button class="btn sm" type="button" data-a="new" style="flex:0 0 auto">➕ مستخدم جديد</button></div>' +
      '<div class="f" style="margin-top:10px"><input type="text" id="uq" placeholder="بحث بالاسم أو الكود أو الدور"></div><div id="ulist"></div></div><div id="uform"></div>' +
      '<div class="panel"><h3>🗓️ الترمات</h3>' + d.terms.map(function (t) { return '<div class="ur"><span><b>' + esc(t.name) + '</b> <small style="color:var(--m)">' + esc(t.program) + ' • من ' + esc(t.start) + ' • ' + t.weeks + ' أسبوع × ' + t.days + ' • ميد أ' + (t.mid || '—') + ' • فاينال أ' + (t.final || '—') + '</small></span><span class="pill ' + (t.status === 'حالي' ? 'ok' : '') + '">' + esc(t.status) + '</span></div>'; }).join('') +
      '<div class="sub" style="margin-top:8px">إعدادات الترم (الاسم، الأسابيع، الميد والفاينال) بتتعدل دلوقتي من تاب «الترمات» في الشيت.</div></div>');
    userList('');
    var m = $('main');
    m.oninput = function (e) { if (e.target.id === 'uq') userList(e.target.value); };
    m.onclick = function (e) { var b = e.target.closest('[data-a]'); if (!b) return; var a = b.dataset.a;
      if (a === 'new') userForm(null); else if (a === 'edit') userForm(b.dataset.c);
      else if (a === 'toggle') call('adminSetActive', [ME.code, b.dataset.c, b.dataset.on === '1'], function () { toast('اتحفظ'); adminHome(); });
      else if (a === 'usave') saveUser(); else if (a === 'ucancel') $('uform').innerHTML = ''; };
    m.onchange = function (e) { var l = e.target.closest('.chk label'); if (l) l.classList.toggle('on', e.target.checked); };
  });
}
function userList(q) {
  q = (q || '').trim();
  var us = ST.ad.users.filter(function (u) { return !q || (u.name + u.code + u.roles.join()).indexOf(q) !== -1; });
  $('ulist').innerHTML = us.map(function (u) { return '<div class="ur' + (u.active ? '' : ' off') + '"><span><b>' + esc(u.name) + '</b> <small style="color:var(--m)">' + esc(u.code) + ' • ' + esc(u.roles.join('، ')) +
    (u.branch || u.section || u.classes ? ' • ' + esc([u.branch, u.section, u.classes].filter(String).join(' / ')) : '') + '</small></span><span style="white-space:nowrap"><button class="btn ghost" type="button" data-a="edit" data-c="' + esc(u.code) + '">تعديل</button>' +
    '<button class="btn ghost" type="button" data-a="toggle" data-c="' + esc(u.code) + '" data-on="' + (u.active ? '0' : '1') + '">' + (u.active ? 'إيقاف' : 'تفعيل') + '</button></span></div>'; }).join('') || '<div class="empty">مفيش نتايج</div>';
}
function userForm(code) {
  var d = ST.ad, u = code ? d.users.filter(function (x) { return x.code === code; })[0] : { code: '', name: '', email: '', roles: [], branch: '', section: '', classes: '', contract: '', active: true };
  ST.uNew = !code;
  $('uform').innerHTML = '<div class="panel"><h3>' + (code ? 'تعديل ' + esc(u.name) : 'مستخدم جديد') + '</h3>' +
    '<div class="row"><div class="f"><label class="lb">الكود (4–8 أرقام):</label><input type="text" id="u-code" inputmode="numeric" value="' + esc(u.code) + '"' + (code ? ' disabled' : '') + '></div><div class="f"><label class="lb">الاسم:</label><input type="text" id="u-name" value="' + esc(u.name) + '"></div></div>' +
    '<div class="f"><label class="lb">الأدوار:</label><div class="chk">' + d.roles.map(function (r) { var on = u.roles.indexOf(r) !== -1; return '<label class="' + (on ? 'on' : '') + '"><input type="checkbox" value="' + esc(r) + '"' + (on ? ' checked' : '') + '>' + esc(r) + '</label>'; }).join('') + '</div></div>' +
    '<div class="row"><div class="f"><label class="lb">الفرع:</label><select id="u-branch">' + opts(d.branches.map(function (b) { return { v: b.code, l: b.name }; }), u.branch, 'كل الفروع') + '</select></div>' +
    '<div class="f"><label class="lb">القسم:</label><select id="u-section">' + opts(d.sections.map(function (s) { return { v: s.code, l: s.name }; }), u.section, 'كل الأقسام') + '</select></div></div>' +
    '<div class="f"><label class="lb">المجموعات (اختياري، مفصولة بفاصلة — فاضي = كل مجموعات النطاق):</label><input type="text" id="u-classes" value="' + esc(u.classes) + '" list="cl-list"><datalist id="cl-list">' + d.classes.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist></div>' +
    '<div class="row"><div class="f"><label class="lb">نوع التعاقد:</label><select id="u-contract">' + opts(['فول تايم', 'بارت تايم', 'متطوع'], u.contract, '—') + '</select></div><div class="f"><label class="lb">الإيميل (للدخول بحساب Google بعدين):</label><input type="email" id="u-email" value="' + esc(u.email) + '"></div></div>' +
    '<div class="row"><button class="btn" type="button" data-a="usave" id="usave">حفظ ✅</button><button class="btn sec" type="button" data-a="ucancel">إلغاء</button></div></div>';
  $('uform').scrollIntoView({ behavior: 'smooth' });
}
function saveUser() {
  var roles = [].map.call(document.querySelectorAll('#uform .chk input:checked'), function (i) { return i.value; });
  var data = { code: $('u-code').value.trim(), name: $('u-name').value.trim(), roles: roles, branch: $('u-branch').value, section: $('u-section').value,
               classes: $('u-classes').value.trim(), contract: $('u-contract').value, email: $('u-email').value.trim(), isNew: ST.uNew };
  var b = $('usave'); busy(b, 'جاري الحفظ… ⏳');
  call('adminSaveUser', [ME.code, data], function () { busy(b); Sound.play('ok'); toast('اتحفظ ✅'); adminHome(); }, function (e) { busy(b); failed(e); });
}

$('login-btn').addEventListener('click', function () { login(); });
$('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
$('out').addEventListener('click', logout);

$('tabs').addEventListener('click', function (e) { var b = e.target.closest('button[data-v]'); if (b) { Sound.play('tap'); go(b.dataset.v); } });
(function () { if (store('mk_snd') === '0') { Sound.on = false; $('snd').textContent = '🔇'; } var c = store('mk_code'); if (c) { $('code').value = c; login(true); } })();
</script>
