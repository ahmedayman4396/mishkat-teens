<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo-teens.svg" type="image/svg+xml">
<title>دار مشكاة — نظام المتابعة</title>
<meta name="theme-color" content="#007baf">
<style>
:root{--c:#007baf;--cd:#005f87;--g:#b4d437;--gd:#9cb82e;--bg:#f4f7f6;--t:#333;--m:#777;--ln:#e6eaee;
--l1:#e74c3c;--l2:#f0932b;--l3:#f1c40f;--l4:#3498db;--l5:#27ae60;--no:#95a5a6;--ok:#1e8449;--warn:#a04000;--bad:#c0392b}
*{box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--t);margin:0;-webkit-tap-highlight-color:transparent}
.hdr{background:linear-gradient(135deg,var(--c) 0%,var(--cd) 100%);height:150px;border-radius:0 0 36px 36px;position:absolute;top:0;left:0;right:0;z-index:-1}
.wrap{padding:16px 14px 60px;max-width:720px;margin:44px auto 0}
.card{background:#fff;border-radius:16px;padding:22px 18px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.08)}
.logos{background:#fff;border-radius:18px;margin:-70px auto 14px;padding:12px 18px;box-shadow:0 4px 15px rgba(0,0,0,.1);display:inline-flex;align-items:center;gap:18px}
.logos img{display:block}.logos .lt{height:74px}.logos .ld{height:42px}.logos .sep{width:1px;height:56px;background:var(--ln)}
.brand{background:#fff;border-radius:10px;padding:4px 8px;display:inline-flex;align-items:center}.brand img{height:30px;display:block}.brand img+img{margin-inline-start:8px}
h2{color:var(--c);margin:0 0 4px;font-size:21px}h3{color:var(--c);margin:0 0 10px;font-size:16px}
.sub{color:var(--m);font-size:13.5px;margin:0 0 16px}
.f{text-align:right;margin-bottom:12px}.lb{display:block;font-weight:600;margin-bottom:5px;color:var(--c);font-size:13.5px}
input[type=text],input[type=date],input[type=email],input[type=number],input[type=password],select,textarea{width:100%;padding:11px;border:2px solid #eef1f5;border-radius:10px;font-size:16px;background:#f9fbfd;font-family:inherit}
textarea{min-height:60px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--g);background:#fff;outline:none}
.btn{background:linear-gradient(135deg,var(--g) 0%,var(--gd) 100%);color:#fff;border:none;padding:13px 16px;font-size:16px;font-weight:bold;border-radius:10px;cursor:pointer;width:100%;font-family:inherit}
.btn:disabled{opacity:.6;cursor:default}.btn.sec{background:#fff;color:var(--c);border:2px solid var(--c)}.btn.sm{width:auto;padding:7px 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--c);border:none;padding:6px 8px;font-size:13px;width:auto;text-decoration:underline}
.msg{display:none;margin-top:10px;padding:10px;border-radius:8px;font-weight:bold;background:#fdecea;color:var(--bad)}.msg.show{display:block}
.hidden{display:none!important}
.top{color:#fff;margin:-30px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h2{color:#fff;font-size:18px;margin:0}.top .s{font-size:12.5px;opacity:.9}
.top button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:7px 10px;font-family:inherit;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:#fff;padding:6px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:12px}
.tabs button{flex:1 0 auto;white-space:nowrap;padding-left:10px!important;padding-right:10px!important;border:none;background:transparent;padding:10px 4px;border-radius:10px;font-family:inherit;font-size:14px;color:#555;cursor:pointer}
.tabs button.on{background:var(--c);color:#fff;font-weight:bold}
.panel{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:12px;text-align:right}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;background:#eef1f5;color:#555}
.pill.ok{background:#d5f5e3;color:var(--ok)}.pill.no{background:#fdecea;color:var(--bad)}.pill.wait{background:#fde3c8;color:var(--warn)}.pill.c{background:#e3f1f8;color:var(--c)}
.line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px}.line .k{color:var(--m);min-width:62px}
.cls{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:right;border-right:5px solid var(--no);cursor:pointer}
.cls.ok{border-right-color:var(--l5)}.cls.warn{border-right-color:var(--l2)}.cls.late{border-right-color:var(--l1)}
.cls h4{margin:0;color:var(--c);font-size:15.5px}.cls .m{font-size:12.5px;color:var(--m);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:11px 6px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.stat b{display:block;font-size:21px;color:var(--c);font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--m)}
.st{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:right}
.st.done{box-shadow:0 0 0 2px var(--l5) inset}
.st-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.st-h b{font-size:15px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{flex:1 1 17%;min-width:56px;padding:8px 3px;font-size:13px;border:2px solid var(--ln);border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;color:#555}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}.chip.on.absent{background:var(--l1);border-color:var(--l1)}
.crit{margin-top:7px}.crit-r{display:flex;align-items:center;gap:6px}.crit-t{font-size:13px;font-weight:600;color:#444;width:62px;flex:0 0 62px}
.lv{display:flex;gap:4px;flex:1}
.lv button{flex:1;border:2px solid var(--ln);border-radius:9px;background:#f9fbfd;cursor:pointer;font-family:inherit;color:#555;padding:7px 0;font-size:15px;font-weight:bold;min-width:0}
.lv button.na{flex:1.7;font-size:11px;font-weight:normal;line-height:1.1}
.lv button.on[data-v="1"]{background:var(--l1);border-color:var(--l1);color:#fff}.lv button.on[data-v="2"]{background:var(--l2);border-color:var(--l2);color:#fff}
.lv button.on[data-v="3"]{background:var(--l3);border-color:var(--l3);color:#333}.lv button.on[data-v="4"]{background:var(--l4);border-color:var(--l4);color:#fff}
.lv button.on[data-v="5"]{background:var(--l5);border-color:var(--l5);color:#fff}.lv button.on.na{background:var(--no);border-color:var(--no);color:#fff}
.desc{font-size:12px;color:var(--m);margin:2px 68px 0 0;min-height:0}
.scl{font-size:12px;color:var(--m);margin:2px 68px 0 0}.scl summary{cursor:pointer;color:var(--c);list-style:none;display:inline-block}.scl summary::-webkit-details-marker{display:none}.scl div{padding:2px 0}.scl b{display:inline-block;width:16px;color:#444}
.grp{font-size:12px;color:var(--c);font-weight:bold;margin-top:10px;border-top:1px dashed var(--ln);padding-top:6px}
.fu{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.fu button{border:2px solid var(--ln);background:#fff;border-radius:20px;padding:5px 10px;font-family:inherit;font-size:12.5px;cursor:pointer;color:#555}
.fu button.y{background:#d5f5e3;border-color:var(--l5);color:var(--ok)}.fu button.n{background:#fdecea;border-color:var(--l1);color:var(--bad)}
.note{font-size:13px;background:#f6f9fc;border-radius:10px;padding:8px 10px;margin-top:6px}.note small{color:var(--m)}
.info{background:#f6f9fc;border:1px solid #e3ebf2;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;text-align:right}
.info b{color:var(--c)}.info summary{cursor:pointer;color:var(--c);font-weight:bold}
.task{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:14px}.task .tc{display:flex;gap:5px}
.task button{border:2px solid var(--ln);background:#fff;border-radius:9px;padding:6px 10px;font-family:inherit;cursor:pointer;font-size:13px}
.task button.on.y{background:var(--l5);border-color:var(--l5);color:#fff}.task button.on.n{background:var(--l2);border-color:var(--l2);color:#fff}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}.bar .nm{width:62px}.bar .tr{flex:1;height:10px;background:#eef1f5;border-radius:10px;overflow:hidden}
.bar .fl{height:100%;border-radius:10px;background:var(--c)}.bar .vl{width:58px;text-align:left;font-weight:bold;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap}th{color:var(--m);font-weight:600}
.tw{overflow-x:auto}td.ed{cursor:pointer;text-decoration:underline dotted}
.s1{color:var(--l1);font-weight:bold}.s2{color:var(--l2);font-weight:bold}.s3{color:#b7950b;font-weight:bold}.s4{color:var(--l4);font-weight:bold}.s5{color:var(--l5);font-weight:bold}
.empty{color:var(--m);font-size:13.5px;text-align:center;padding:12px}.loading{text-align:center;color:var(--m);padding:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92%;text-align:center}
.toast.show{opacity:.95}
.sticky{position:sticky;bottom:10px;z-index:5}
.back{background:rgba(255,255,255,.95);border:none;color:var(--c);font-family:inherit;font-size:13.5px;cursor:pointer;padding:6px 12px;margin-bottom:8px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chk{display:flex;flex-wrap:wrap;gap:6px}.chk label{border:2px solid var(--ln);border-radius:20px;padding:5px 10px;font-size:13px;cursor:pointer}.chk input{display:none}
.chk label.on{background:var(--c);color:#fff;border-color:var(--c)}
input.bad{border-color:var(--bad)!important;background:#fdecea!important}
.ur{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}.ur.off{opacity:.5}
@media print{.top,.tabs,.back,button,input[type=month]{display:none!important}body{background:#fff}.panel{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<div class="hdr" id="hdr"></div>
<div class="wrap">
  <div class="card" id="v-login">
    <div class="logos"><img class="ld" src="logo-dar.svg" alt="دار مشكاة"><span class="sep"></span><img class="lt" src="logo-teens.svg" alt="مشكاة Teens"></div>
    <h2>نظام المتابعة</h2>
    <p class="sub">بوابة المتابعة — المربين والمنسقين والإدارة</p>
    <div class="f"><label class="lb" for="code">الكود:</label><input type="text" id="code" inputmode="numeric" autocomplete="off" placeholder="الكود الخاص بيك"></div>
    <button class="btn" id="login-btn" type="button">دخول 🚀</button>
    <div class="msg" id="login-msg"></div>
  </div>
  <div class="hidden" id="v-app">
    <div class="top"><div style="display:flex;align-items:center;gap:10px"><span class="brand" id="brand"></span><div><h2 id="hello"></h2><div class="s" id="hello-s"></div></div></div>
      <div><button type="button" id="snd" title="الأصوات">🔊</button> <button type="button" id="out">خروج</button></div></div>
    <div class="tabs" id="tabs"></div>
    <div id="main"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxMaU2MpXEFYy2rHQOLLWH_9wAHpfthVP5zTXWCN6QgVHxBD-50BVQ3KeydDspvrzGorw/exec';
var LOGOS = { teens: 'logo-teens.svg', dar: 'logo-dar.svg' };
var ME = null, VIEW = '', ST = {};
var VIEWS = { coach: '📋 مجموعاتي', follow: '📊 المتابعة', asmt: '📝 التقييمات', meet: '🗓️ حضور المربين', cert: '📜 الشهادات', quran: '📖 القرآن', acad: '🎓 الأكاديمي', quality: '✅ الجودة', board: '🏆 الأثر', admin: '⚙️ الأدمن' };

// ---------- أصوات ----------
var Sound = { ctx: null, on: true,
  play: function (k) { if (!this.on) return; try {
    if (!this.ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    var c = this.ctx, seq = { tap: [660], ok: [523, 659, 784, 1047], err: [250, 190], lv: [392 + 40 * (Number(k.slice(2)) || 0)] }[k.indexOf('lv') === 0 ? 'lv' : k] || [660];
    seq.forEach(function (f, i) { var t = c.currentTime + i * 0.1, o = c.createOscillator(), g = c.createGain();
      o.type = k === 'err' ? 'square' : 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(k === 'err' ? 0.05 : 0.14, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.2); }); } catch (e) {} } };

// ---------- أدوات ----------
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var tt; function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { e.classList.remove('show'); }, 3000); }
function busy(b, t) { if (!b) return; if (!b.dataset.l) b.dataset.l = b.textContent; b.disabled = !!t; b.textContent = t || b.dataset.l; }
// ---------- دخول Google (للبيانات الحساسة بس) ----------
var TOK = (function () { var t = store('mk_tok'); return t && tokExp(t) > Date.now() ? t : ''; })();
function tokExp(t) { try { var p = t.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'); return Number(decodeURIComponent(escape(atob(p))).split('|')[1]) || 0; } catch (e) { return 0; } }
function tokEmail(t) { try { var p = t.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'); return decodeURIComponent(escape(atob(p))).split('|')[0]; } catch (e) { return ''; } }
function googleSignIn(after) {
  if (!ME || !ME.auth || !ME.auth.url) { toast('الدخول بحساب Google لسه مش متجهز — كلّم الأدمن'); return; }
  var w = window.open(ME.auth.url, 'mkauth', 'width=480,height=620');
  if (!w) { toast('المتصفح منع النافذة — اسمح بالنوافذ المنبثقة وجرّب تاني'); return; }
  var on = function (e) {
    if (!/(\.googleusercontent\.com|script\.google\.com)$/.test(e.origin) || !e.data || e.data.mkAuth === undefined) return;
    window.removeEventListener('message', on);
    if (!e.data.mkAuth) { failed(new Error('مقدرناش نعرف حسابك على Google')); return; }
    TOK = e.data.mkAuth; store('mk_tok', TOK); Sound.play('ok'); toast('🔐 دخلت بـ ' + e.data.email);
    if (after) after(); else go(VIEW);
  };
  window.addEventListener('message', on);
}
function googleBtn(label) { return '<button class="btn sm" type="button" data-google="1" style="flex:0 0 auto">🔐 ' + (label || 'ادخل بحساب Google') + '</button>'; }
document.addEventListener('click', function (e) { if (e.target.closest('[data-google]')) { e.stopPropagation(); googleSignIn(); } }, true);
function call(fn, args, ok, fail) {
  fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args, tok: TOK }) })
    .then(function (r) { return r.json(); })
    .then(function (r) { if (r.ok) ok(r.data); else (fail || failed)(new Error(r.error)); })
    .catch(function () { (fail || failed)(new Error('تعذر الاتصال، اتأكد من الإنترنت وجرب تاني')); });
}
function failed(e) {
  Sound.play('err');
  if (String(e.message).indexOf('GOOGLE_REQUIRED|') === 0) {
    var msg = e.message.split('|')[1] + (TOK ? ' — إنت داخل بـ ' + tokEmail(TOK) + '، والإيميل ده مش هو المسجّل باسمك.' : '');
    main('<div class="panel"><h3>🔐 محتاج دخول بحساب Google</h3><div class="sub">' + esc(msg) + '</div><div class="row" style="margin-top:10px">' + googleBtn() + '</div></div>');
    return;
  }
  if (ME && String(e.message).indexOf('الكود غير صحيح') === 0) { logout(); var lm = $('login-msg'); lm.textContent = 'الكود اتغيّر أو اتوقف — ادخل تاني بالكود الجديد'; lm.classList.add('show'); return; }
  toast('⚠️ ' + e.message);
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function sc(v) { var n = Number(v); return n >= 1 && n <= 5 ? '<span class="s' + n + '">' + n + '</span>' : (v ? '<small>' + esc(v === 'لم يُلاحظ' ? 'ل' : v) + '</small>' : '—'); }
function opts(list, cur, ph) { return (ph ? '<option value="">' + ph + '</option>' : '') + list.map(function (x) { var v = typeof x === 'object' ? x.v : x, l = typeof x === 'object' ? x.l : x; return '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join(''); }
function main(h) { $('main').innerHTML = h; window.scrollTo(0, 0); }
function loading() { main('<div class="panel loading">جاري التحميل…</div>'); }

// ---------- هوية القسم ----------
var BRANDS = { teens: { name: 'مشكاة Teens', color: '#007baf' }, dar: { name: 'دار مشكاة', color: '#1b95cc' } };
function brand(sec) {
  var all = ME && ME.sections || [];
  if (!sec && all.length > 1) {   // v5.17: حساب على القسمين = اللوجوين مع بعض
    document.documentElement.style.setProperty('--c', '#007baf'); document.documentElement.style.setProperty('--cd', shade('#007baf'));
    $('hello-s').textContent = all.map(function (x) { return (BRANDS[x.code] || x).name; }).join(' • ');
    $('brand').innerHTML = all.map(function (x) { return LOGOS[x.code] ? '<img src="' + LOGOS[x.code] + '" alt="' + esc(x.name) + '">' : ''; }).join('');
    $('brand').classList.remove('hidden'); return;
  }
  sec = sec || (all[0] && all[0].code);
  var s = BRANDS[sec] ? { code: sec, name: BRANDS[sec].name, color: BRANDS[sec].color } : (ME && ME.sections || []).filter(function (x) { return x.code === sec; })[0];
  var color = s && s.color ? s.color : '#007baf';
  document.documentElement.style.setProperty('--c', color);
  document.documentElement.style.setProperty('--cd', shade(color));
  $('hello-s').textContent = s ? s.name : '';
  var logo = s ? (LOGOS[s.code] || (/^https?:/.test(s.logo || '') ? s.logo : '')) : '';
  $('brand').innerHTML = logo ? '<img src="' + esc(logo) + '" alt="' + esc(s.name) + '">' : '';
  $('brand').classList.toggle('hidden', !logo);
}
function shade(hex) { var n = parseInt(hex.slice(1), 16), r = (n >> 16) * .75, g = (n >> 8 & 255) * .75, b = (n & 255) * .75;
  return '#' + [r, g, b].map(function (x) { return ('0' + Math.round(x).toString(16)).slice(-2); }).join(''); }

// ---------- الدخول ----------
function login(silent) {
  var code = $('code').value.trim(), msg = $('login-msg');
  if (!code) { if (!silent) { msg.textContent = 'اكتب الكود'; msg.classList.add('show'); Sound.play('err'); } return; }
  var b = $('login-btn'); busy(b, 'جاري التحقق… ⏳'); msg.classList.remove('show');
  call('login', [code], function (r) {
    busy(b);
    if (!r.success) { store('mk_code', null); msg.textContent = r.message; msg.classList.add('show'); Sound.play('err'); return; }
    ME = r; ME.code = code; store('mk_code', code); Sound.play('ok');
    $('hello').textContent = 'أهلاً، ' + r.name;
    $('v-login').classList.add('hidden'); $('v-app').classList.remove('hidden');
    $('tabs').innerHTML = r.views.map(function (v) { return '<button type="button" data-v="' + v + '">' + VIEWS[v] + '</button>'; }).join('');
    $('tabs').classList.toggle('hidden', r.views.length < 2);
    brand(r.sections.length === 1 ? r.sections[0].code : '');
    if (!r.views.length) { main('<div class="panel empty">حسابك ملوش صلاحيات لسه — كلّم الأدمن.</div>'); return; }
    go(r.views[0]);
  }, function (e) { busy(b); msg.textContent = e.message; msg.classList.add('show'); Sound.play('err'); });
}
function logout() { ME = null; store('mk_code', null); TOK = ''; store('mk_tok', null); $('code').value = ''; $('v-app').classList.add('hidden'); $('v-login').classList.remove('hidden'); }
function go(v) {
  VIEW = v;
  [].forEach.call($('tabs').children, function (b) { b.classList.toggle('on', b.dataset.v === v); });
  if (v === 'coach') coachHome(); else if (v === 'follow') followHome(0); else if (v === 'admin') adminHome();
  else if (v === 'quran') quranHome(); else if (v === 'acad') { ST.caseBack = acadHome; acadHome(); } else if (v === 'quality') qualityHome(); else if (v === 'board') boardHome(); else if (v === 'asmt') asmtHome(); else if (v === 'meet') meetHome(); else if (v === 'cert') certHome();
}

function coachHome() {
  var cs = ME.classes;
  main('<div class="panel"><h3>📋 مجموعاتي</h3>' + (cs.length ? cs.map(function (c) {
      return '<div class="cls ok" data-cls="' + esc(c.name) + '"><h4>' + esc(c.name) + '</h4><div class="m">' + esc(c.program) + ' • ' + esc(c.level || '') +
        (c.hasTerm ? ' • ' + esc(c.term) : ' • <span class="pill wait">مفيش ترم حالي</span>') + '</div></div>';
    }).join('') : '<div class="empty">مفيش مجموعات مسجلة باسمك.</div>') +
    '<button class="btn sec" type="button" id="sub-btn">🔁 أنا مربي بديل النهارده</button> <button class="btn sec" type="button" id="myq-btn">🕌 تقييماتي من قسم القرآن</button> <button class="btn sec" type="button" id="mym-btn">🗓️ حضوري في الاجتماعات</button></div><div id="sub-list"></div><div id="todo"></div>');
  loadTodo();
  $('main').onclick = function (e) {
    var c = e.target.closest('[data-cls]'); if (c) { Sound.play('tap'); openSession(c.dataset.cls, null, c.dataset.sub === '1'); return; }
    if (e.target.id === 'myq-btn') { myQuranEvals(); return; }
    if (e.target.id === 'mym-btn') { myMeetingsView(); return; }
    if (e.target.id === 'sub-btn') {
      $('sub-list').innerHTML = '<div class="panel loading">جاري التحميل…</div>';
      call('substituteClasses', [ME.code], function (list) {
        $('sub-list').innerHTML = '<div class="panel"><h3>اختار المجموعة اللي هتغطيها</h3>' + (list.length ? list.map(function (c) {
          return '<div class="cls" data-cls="' + esc(c.name) + '" data-sub="1"><h4>' + esc(c.name) + '</h4><div class="m">' + esc(c.program) + ' • ' + esc(c.level || '') + '</div></div>'; }).join('')
          : '<div class="empty">مفيش مجموعات تانية في فرعك.</div>') + '</div>';
      });
    }
  };
}

function openSession(cls, n, sub) {
  loading();
  call('getSession', [ME.code, cls, n, !!sub], function (r) { ST = { s: r, sub: !!sub, rows: {}, guests: [], tasks: {}, date: r.today }; brand(r.section);
    if (!r.readonly) r.students.forEach(function (s) { var p = (r.projectStatus || {})[s.code] || {};
      ST.rows[s.code] = { code: s.code, att: 'حاضر', scores: {}, follow: {}, notes: '', behavior: '', support: '', project: { status: p.status || '', scores: Object.assign({}, p.scores || {}), evidence: p.evidence || '' } }; });
    renderSession(); }, function (e) { failed(e); coachHome(); });
}

function sessionLabel(s) {
  var st = { done: '✅', cancelled: '🚫', open: '', future: '⏳', before: '⏸ قبل السيستم' }[s.status];
  return 'حلقة ' + s.n + ' — أسبوع ' + s.week + (s.mid ? ' • ميد' : '') + (s.final ? ' • فاينال' : '') + ' ' + st;
}

function renderSession() {
  var r = ST.s, s = r.session;
  var head = '<button class="back" type="button" data-act="home">→ رجوع لمجموعاتي</button>' +
    '<div class="panel"><div class="row"><div><h3 style="margin:0">' + esc(r.cls) + (r.mode === 'بديل' ? ' <span class="pill wait">بديل</span>' : '') + '</h3>' +
    '<div class="sub" style="margin:2px 0 0">' + esc(r.program) + ' • ' + esc(r.level || '') + ' • ' + esc(r.term.name) + '</div></div>' +
    '<button class="btn sm sec" type="button" data-act="history" style="flex:0 0 auto">🗂️ تقييماتي السابقة</button></div>' +
    '<div class="f" style="margin:10px 0 0"><select id="sess">' + r.sessions.map(function (x) { return '<option value="' + x.n + '"' + (x.n === s.n ? ' selected' : '') + (x.status === 'cancelled' || x.status === 'before' ? ' disabled' : '') + '>' + sessionLabel(x) + '</option>'; }).join('') + '</select></div></div>';
  var info = '';
  if (s.family) info += '<div class="info">🏠 الأسبوع ده فيه نشاط أسرة — علّم لكل طالب عمله ولا لأ.</div>';
  if ((r.asmts || []).length) info += asmtSessionHTML(r);
  else if (s.mid || s.final) info += '<div class="info">📝 الأسبوع ده أسبوع ' + (s.mid ? 'الميد ترم' : 'الفاينال') + ' — التقييم لسه ما اتعملش، المنسق هيضيفه من «📝 التقييمات».</div>';
  if (r.readonly) { main(head + info + savedHTML(r)); bindSession(); return; }
  var body = '<div class="panel"><div class="row"><div class="f" style="margin:0"><label class="lb" for="sdate">تاريخ الحلقة:</label><input type="date" id="sdate" value="' + esc(ST.date) + '" max="' + esc(r.today) + '"></div>' +
    '<div style="flex:0 0 auto;font-size:13px;color:var(--m)">' + r.students.length + ' طالب</div></div></div>';
  body += r.students.map(function (st) { return studentHTML(st); }).join('');
  body += ST.guests.map(function (g) { return studentHTML(g, true); }).join('');
  body += '<div class="panel"><div class="row"><button class="btn sm sec" type="button" data-act="guest">➕ طالب زائر من مجموعة تانية</button><button class="btn sm sec" type="button" data-act="newst">🆕 طالب جديد</button></div><div id="guest-box"></div></div>';
  body += tasksHTML();
  body += '<div class="sticky"><button class="btn" type="button" data-act="save" id="save-btn">حفظ الحلقة ✅</button></div>';
  main(head + info + body); bindSession();
}

// v5.17: أسبوع التقييم — المربي بيسجّل التقييم اللي المنسق بناه، والحلقة حضور وملاحظات بس
function isAsmtWeek() { return !!(ST.s && (ST.s.asmts || []).length); }
// v5.17.1: في أسبوع التقييم المحتوى بيتسجل في التقييم، والقرآن بيفضل في الحلقة (إلا لو التقييم نفسه فيه قرآن)
function sessCrit(c) { return !isAsmtWeek() || c.group === 'قرآن' && !ST.s.asmts.some(function (a) { return a.nQuran > 0; }); }
function asmtSessionHTML(r) {
  return '<div class="panel" style="border:2px solid var(--c)"><h3>📝 أسبوع التقييم</h3><div class="sub">' + (r.asmts.some(function (a) { return a.nQuran > 0; }) ? 'الحلقة دي للتقييم: سجّل التقييم (المحتوى والقرآن) من الزرار تحت. في الحلقة نفسها: الحضور والملاحظات بس.' : 'الحلقة دي للتقييم: سجّل تقييم المحتوى من الزرار تحت. في الحلقة نفسها: الحضور وتقييم القرآن والملاحظات بس.') + '</div>' +
    r.asmts.map(function (a) {
      var st = a.submitted ? '<span class="pill ok">✅ اتسلّم</span>' : a.done ? '<span class="pill wait">' + a.done + ' طالب متسجل</span>' : '<span class="pill">لسه</span>';
      return '<div class="ur"><span><b>' + esc(a.name) + '</b> <small style="color:var(--m)">السلّم ' + a.min + '–' + a.max + (a.nQuran ? ' • فيه القرآن' : '') + '</small> ' + st + '</span>' +
        '<button class="btn sm" type="button" data-act="asmt" data-id="' + esc(a.id) + '" style="flex:0 0 auto">' + (a.status === 'مقفول' ? 'عرض' : '📝 سجّل التقييم') + '</button></div>'; }).join('') + '</div>';
}
function scaleOf(key, band) { var s = ME.scales || {}; return s[key + '|' + (band || '')] || s[key + '|'] || null; }
function allLv(levels) {
  if (!levels || !levels.some(function (x) { return x; })) return '';
  return '<details class="scl"><summary>ⓘ معنى الدرجات</summary>' + levels.map(function (t, i) { return t ? '<div><b>' + (i + 1) + '</b>' + esc(t) + '</div>' : ''; }).join('') + '</details>';
}
function threeLv(levels) { return !!(levels && levels[0] && !levels[1] && levels[2] && !levels[3] && levels[4]); }
function lvShort(levels, v) { return String(levels[v - 1] || v).split(' — ')[0]; }
function critHTML(code, c, val) {
  var three = threeLv(c.levels);
  var lv = (three ? [1, 3, 5] : [1, 2, 3, 4, 5]).map(function (v) { return '<button type="button" data-act="score" data-s="' + esc(code) + '" data-c="' + c.key + '" data-v="' + v + '" class="' + (Number(val) === v ? 'on' : '') + '"' + (three ? ' style="font-size:12px;width:auto;padding:0 10px"' : '') + '>' + (three ? esc(lvShort(c.levels, v)) : v) + '</button>'; }).join('') +
    '<button type="button" class="na' + (val === ME.notObserved ? ' on' : '') + '" data-act="score" data-s="' + esc(code) + '" data-c="' + c.key + '" data-v="na">لم يُلاحظ</button>';
  var d = Number(val) >= 1 ? c.levels[Number(val) - 1] : (val === ME.notObserved ? 'مش داخل في المتوسط' : '');
  return '<div class="crit"><div class="crit-r"><div class="crit-t">' + esc(c.name) + '</div><div class="lv">' + lv + '</div></div>' + (d ? '<div class="desc">' + esc(d) + '</div>' : '') + allLv(c.levels) + '</div>';
}

function critsFor(st) { var b = ST.s.criteriaByBand || {}; return b[st.band] || ST.s.criteria; }
function ageHTML(st) {
  var a = (ST.s.ageBands || {})[st.band], lbl = st.age ? st.age + ' سنين' + (st.ageEstimated ? ' (تقديري)' : '') : 'السن مش متسجل';
  var h = '<button type="button" class="pill ' + (st.ageEstimated || !st.age ? 'wait' : 'c') + '" data-act="age" data-s="' + esc(st.code) + '" style="border:none;cursor:pointer;font-family:inherit">👶 ' + lbl + '</button>';
  if (ST.openAge === st.code && a) h += '<div class="info" style="margin:8px 0 0"><b>سن ' + esc(a.ages) + '</b>' + (st.ageEstimated ? ' — تاريخ الميلاد مش متسجل، فالأوصاف مؤقتًا على السن المعتاد للمستوى (المنسق يسجّله)' : '') +
    '<p><b>معرفيًا:</b> ' + esc(a.cognitive) + '</p><p><b>اجتماعيًا ووجدانيًا:</b> ' + esc(a.social) + '</p><p><b>القياس:</b> ' + esc(a.measure) + '</p></div>';
  return h;
}
function studentHTML(st, guest) {
  var r = ST.s, row = guest ? st : ST.rows[st.code], rated = ME.rated.indexOf(row.att) !== -1, complete = isComplete(row);
  var h = '<div class="st' + (complete ? ' done' : '') + '" data-st="' + esc(st.code) + '"><div class="st-h"><b>' + esc(st.name) + '</b><span>' +
    (guest ? '<span class="pill wait">زائر — تعويضي</span> ' : '') + (st.pending ? '<span class="pill wait">مستني تأكيد</span> ' : '') + (st.quran ? '<span class="pill c">' + esc(st.quran) + '</span>' : '') + '</span></div>' +
    '<div style="margin-top:4px">' + ageHTML(st) + '</div>';
  if (!guest) h += '<div class="chips">' + ME.attendance.map(function (a) { return '<button type="button" class="chip' + (row.att === a ? ' on' + (ME.rated.indexOf(a) === -1 ? ' absent' : '') : '') + '" data-act="att" data-s="' + esc(st.code) + '" data-v="' + a + '">' + a + '</button>'; }).join('') + '</div>';
  if (rated || guest) {
    var g = '';
    critsFor(st).filter(sessCrit).forEach(function (c) { if (c.group !== g) { g = c.group; h += '<div class="grp">' + (g === 'قرآن' ? '📖 القرآن' : '💡 المحتوى') + '</div>'; } h += critHTML(st.code, c, row.scores[c.key]); });
    h += '<div class="fu">' + (ST.s.session.family ? ME.followups : []).map(function (f) { var v = row.follow[f[0]]; return '<button type="button" data-act="fu" data-s="' + esc(st.code) + '" data-f="' + f[0] + '" class="' + (v === 'تم' ? 'y' : v === 'لم يتم' ? 'n' : '') + '">' + (v === 'تم' ? '✓ ' : v === 'لم يتم' ? '✗ ' : '') + f[1] + '</button>'; }).join('') +
      '<button type="button" data-act="beh" data-s="' + esc(st.code) + '" class="' + (row.behavior ? 'n' : '') + '">⚑ ملاحظة سلوكية</button></div>';
    if (row.behavior !== '' || row._showBeh) h += '<div class="f" style="margin-top:6px"><input type="text" data-in="behavior" data-s="' + esc(st.code) + '" value="' + esc(row.behavior) + '" placeholder="الموقف باختصار (بيوصل لأخصائي السلوك لو اتكرر)"></div>';
    h += '<div class="f" style="margin:6px 0 0"><textarea data-in="notes" data-s="' + esc(st.code) + '" placeholder="ملاحظات (اختياري)">' + esc(row.notes) + '</textarea></div>';
  }
  if (!guest && r.session.support) {
    var si = (r.supportInfo || {})[st.code] || {};
    h += '<div class="grp">📖 يحتاج دعم في الحفظ؟</div><div class="chips">' + ['نعم', 'لأ'].map(function (v) { return '<button type="button" class="chip' + (row.support === v ? ' on' + (v === 'نعم' ? ' absent' : '') : '') + '" data-act="sup" data-s="' + esc(st.code) + '" data-v="' + v + '">' + v + '</button>'; }).join('') + '</div>' +
      '<div class="desc" style="margin-right:0">متوسط الحفظ (آخر 3): ' + (si.avgHifz == null ? 'لسه' : si.avgHifz) + (si.lastExam && si.lastExam.quran != null ? ' • قرآن ' + esc(si.lastExam.exam) + ': ' + si.lastExam.quran : '') +
      (si.suggest ? ' • 💡 السيستم بيقترح «نعم»' : '') + (si.last ? ' • آخر قرار: ' + esc(si.last) : '') + '</div>';
  }
  if (!guest && r.project) h += projectHTML(st.code, row);
  return h + '</div>';
}

function projectHTML(code, row) {
  var p = row.project, r = ST.s;
  var h = '<div class="grp">🎯 مشروع: ' + esc(r.project.name) + (r.project.due ? ' <small>(التسليم ' + esc(r.project.due) + ')</small>' : '') + '</div><div class="chips">' +
    ME.projectStatuses.map(function (v) { return '<button type="button" class="chip' + (p.status === v ? ' on' : '') + '" data-act="pst" data-s="' + esc(code) + '" data-v="' + v + '">' + v + '</button>'; }).join('') + '</div>';
  if (p.status === 'سلّم') h += ME.projectDims.map(function (d) {
    var lvs = scaleOf(d[0]), cur = p.scores[d[0]];
    return '<div class="crit"><div class="crit-r"><div class="crit-t">' + d[1] + '</div><div class="lv">' + [1, 2, 3, 4, 5].map(function (v) { return '<button type="button" data-act="psc" data-s="' + esc(code) + '" data-c="' + d[0] + '" data-v="' + v + '" class="' + (cur === v ? 'on' : '') + '">' + v + '</button>'; }).join('') + '</div></div>' +
      (lvs && cur ? '<div class="desc">' + esc(lvs[cur - 1]) + '</div>' : '') + allLv(lvs) + '</div>'; }).join('') +
    '<div class="f" style="margin-top:6px"><input type="text" data-in="pev" data-s="' + esc(code) + '" value="' + esc(p.evidence || '') + '" placeholder="الدليل: موقف شفته أو كلام من ولي الأمر (اختياري)"></div>';
  return h;
}

function tasksHTML() {
  return '<div class="panel"><h3>✅ مهام الحلقة</h3>' + ME.tasks.map(function (t) { var v = ST.tasks[t[0]];
    return '<div class="task"><span>' + t[1] + '</span><span class="tc"><button type="button" class="y' + (v === 'تم' ? ' on' : '') + '" data-act="task" data-t="' + t[0] + '" data-v="تم">✅ تم</button>' +
      '<button type="button" class="n' + (v === 'لم يتم' ? ' on' : '') + '" data-act="task" data-t="' + t[0] + '" data-v="لم يتم">⏳ لم يتم بعد</button></span></div>'; }).join('') +
    '<div class="sub" style="margin:8px 0 0">لو حاجة لسه ما وصلتش اختار «لم يتم بعد» وأكّدها بعدين من «تقييماتي السابقة».</div></div>';
}

function isComplete(row) {
  if (!row.att) return false;
  if (ST.s.session.support && !row._guest && !row.support) return false;
  if (ME.rated.indexOf(row.att) === -1) return projDone(row);
  return ST.s.criteria.filter(sessCrit).every(function (c) { return row.scores[c.key] !== undefined && row.scores[c.key] !== ''; }) && projDone(row);
}
function projDone(row) { if (!ST.s.project || row._guest || isAsmtWeek() && !row.project.status) return true; var p = row.project; if (!p.status) return false;
  return p.status !== 'سلّم' || ME.projectDims.every(function (d) { return !!p.scores[d[0]]; }); }

function rowOf(code) { return ST.rows[code] || ST.guests.filter(function (g) { return g.code === code; })[0]; }

function bindSession() {
  var m = $('main');
  m.onclick = function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act, row = b.dataset.s ? rowOf(b.dataset.s) : null;
    if (a === 'home') { coachHome(); return; }
    if (a === 'history') { history(); return; }
    if (a === 'asmt') { var rc = ST.s.cls, rs = ST.sub, rn = ST.s.session.n; asmtEntry(b.dataset.id, rc, function () { openSession(rc, rn, rs); }); return; }
    if (a === 'att') { row.att = b.dataset.v; }
    else if (a === 'age') { ST.openAge = ST.openAge === b.dataset.s ? null : b.dataset.s; }
    else if (a === 'score') { row.scores[b.dataset.c] = b.dataset.v === 'na' ? ME.notObserved : Number(b.dataset.v); Sound.play(b.dataset.v === 'na' ? 'tap' : 'lv' + b.dataset.v); updateStudent(b.dataset.s); return; }
    else if (a === 'fu') { var cur = row.follow[b.dataset.f]; row.follow[b.dataset.f] = cur === 'تم' ? 'لم يتم' : cur === 'لم يتم' ? '' : 'تم'; }
    else if (a === 'beh') { row._showBeh = !row._showBeh || !!row.behavior; }
    else if (a === 'pst') { row.project.status = b.dataset.v; }
    else if (a === 'sup') { row.support = b.dataset.v; }
    else if (a === 'psc') { row.project.scores[b.dataset.c] = Number(b.dataset.v); }
    else if (a === 'task') { ST.tasks[b.dataset.t] = b.dataset.v; Sound.play('tap'); keepScroll(renderSession); return; }
    else if (a === 'guest') { guestBox(); return; }
    else if (a === 'newst') { newStudent(); return; }
    else if (a === 'addguest') { addGuest(b.dataset.code, b.dataset.name, b.dataset.cls, b.dataset.age, b.dataset.band); return; }
    else if (a === 'save') { save(); return; }
    else if (a === 'confirm-tasks') { confirmTasks(); return; }
    else if (a === 'ptask') { ST.ptasks[b.dataset.t] = 'تم'; b.classList.add('on'); return; }
    else return;
    Sound.play('tap'); updateStudent(b.dataset.s);
  };
  m.oninput = function (e) { var el = e.target; if (el.dataset.in === 'pev') { rowOf(el.dataset.s).project.evidence = el.value; } else if (el.dataset.in) { rowOf(el.dataset.s)[el.dataset.in] = el.value; }
    if (el.id === 'sdate') ST.date = el.value; };
  m.onchange = function (e) { if (e.target.id === 'sess') { var r = ST.s; openSession(r.cls, Number(e.target.value), ST.sub); }
    if (e.target.id === 'gq') findGuest(e.target.value); };
}
function keepScroll(fn) { var y = window.scrollY; fn(); window.scrollTo(0, y); }
function updateStudent(code) {
  var el = document.querySelector('.st[data-st="' + CSS.escape(code) + '"]'); if (!el) return;
  var r = ST.s, st = r.students.filter(function (x) { return x.code === code; })[0] || ST.guests.filter(function (g) { return g.code === code; })[0];
  var tmp = document.createElement('div'); tmp.innerHTML = studentHTML(st, !ST.rows[code]); el.replaceWith(tmp.firstChild);
}

function guestBox() {
  $('guest-box').innerHTML = '<div class="f" style="margin-top:10px"><input type="text" id="gq" placeholder="اكتب اسم الطالب واضغط برّه الخانة"></div><div id="gres"></div>';
  $('gq').focus();
}
function findGuest(q) {
  if (q.trim().length < 2) return;
  $('gres').innerHTML = '<div class="loading">بدوّر…</div>';
  call('findStudents', [ME.code, q, ST.s.cls], function (list) {
    list = list.filter(function (s) { return !ST.rows[s.code] && !ST.guests.some(function (g) { return g.code === s.code; }); });
    $('gres').innerHTML = list.length ? list.map(function (s) { return '<div class="ur"><span>' + esc(s.name) + ' <small style="color:var(--m)">' + esc(s.cls) + '</small></span><button class="btn sm" type="button" data-act="addguest" data-code="' + esc(s.code) + '" data-name="' + esc(s.name) + '" data-cls="' + esc(s.cls) + '" data-age="' + esc(s.age || '') + '" data-band="' + esc(s.band || '') + '">إضافة</button></div>'; }).join('') : '<div class="empty">مفيش نتايج</div>';
  });
}
function addGuest(code, name, cls, age, band) { ST.guests.push({ code: code, name: name + (cls ? ' (' + cls + ')' : ''), att: 'تعويضي', scores: {}, follow: {}, notes: '', behavior: '', _guest: true,
  age: Number(age) || null, band: band || '', ageEstimated: !age }); Sound.play('ok'); keepScroll(renderSession); }
function newStudent() {
  var name = prompt('اسم الطالب الجديد بالكامل:'); if (!name || name.trim().length < 3) return;
  var birth = prompt('تاريخ ميلاده (زي 2019-05-14) أو السنة بس — علشان يتقيّم بأوصاف سنه:') || '';
  call('requestStudent', [ME.code, ST.s.cls, name.trim(), ST.s.session.n, birth.trim()], function () { toast('اتضاف ✅ — هيظهر «مستني تأكيد» للمنسق'); openSession(ST.s.cls, ST.s.session.n, ST.sub); });
}

function save() {
  var r = ST.s, all = r.students.map(function (s) { return ST.rows[s.code]; }).concat(ST.guests);
  var miss = all.filter(function (x) { return !isComplete(x); })[0];
  if (miss) { Sound.play('err'); var nm = (r.students.filter(function (s) { return s.code === miss.code; })[0] || miss).name; toast('باقي تقييم ناقص: ' + nm);
    var el = document.querySelector('.st[data-st="' + CSS.escape(miss.code) + '"]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  var t = ME.tasks.filter(function (x) { return !ST.tasks[x[0]]; })[0];
  if (t) { Sound.play('err'); toast('أكّد مهمة «' + t[1] + '»'); return; }
  var payload = { date: ST.date, tasks: ST.tasks,
    students: r.students.map(function (s) { var x = ST.rows[s.code]; return { code: x.code, att: x.att, scores: x.scores, follow: x.follow, notes: x.notes, behavior: x.behavior,
      support: x.support, project: r.project ? { status: x.project.status, scores: x.project.status === 'سلّم' ? x.project.scores : {}, evidence: x.project.evidence } : null }; }),
    guests: ST.guests.map(function (g) { return { code: g.code, scores: g.scores, follow: g.follow, notes: g.notes, behavior: g.behavior }; }) };
  var b = $('save-btn'); busy(b, 'جاري الحفظ… ⏳');
  call('saveSession', [ME.code, r.cls, r.session.n, payload, ST.sub], function (res) {
    busy(b); Sound.play('ok'); toast('اتحفظت ✅ حاضر ' + res.present + ' • غائب ' + res.absent + ' • ' + res.timing);
    openSession(r.cls, r.session.n, ST.sub);
  }, function (e) { busy(b); failed(e); });
}

    '<div class="line">' + ME.tasks.map(function (t) { var ok = sv.tasks[t[0]] === 'تم'; return '<span class="pill ' + (ok ? 'ok' : 'wait') + '">' + (ok ? '✓ ' : '⏳ ') + t[1] + '</span>'; }).join('') + '</div>' +
    (pend.length ? '<div class="task" style="flex-wrap:wrap">' + pend.map(function (t) { return '<button type="button" class="y" data-act="ptask" data-t="' + t[0] + '">✅ ' + t[1] + ' تم</button>'; }).join('') + '<button class="btn sm" type="button" data-act="confirm-tasks">تأكيد</button></div>' : '') +
    '<div class="sub" style="margin:8px 0 0">الحلقة دي للقراءة بس. لو في غلط اطلب من المنسق يصححه.</div></div>';

}

  call('updateTasks', [ME.code, ST.s.cls, ST.s.session.n, ST.ptasks], function () { Sound.play('ok'); toast('اتأكدت ✅'); openSession(ST.s.cls, ST.s.session.n, ST.sub); });

    var list = d.classes, sessions = [], late = 0, pend = 0, present = 0, total = 0;
    list.forEach(function (c) { (c.sessions || []).forEach(function (s) { if (s.status !== 'cancelled' && s.status !== 'future' && s.status !== 'before') sessions.push(s); if (s.log) { present += s.log.present; total += s.log.present + s.log.absent; if (s.log.timing !== 'في ميعاده') late++; } else if (s.status === 'open') pend++; }); });
    var done = sessions.filter(function (s) { return s.log; }).length;

function classCardHTML(c) {

  c.sessions = (c.sessions || []).filter(function (s) { return s.status !== 'before'; });
  var ss = c.sessions.filter(function (s) { return s.status !== 'future'; });
  var missing = ss.some(function (s) { return s.status === 'open' && !s.log; });
  var tasksPend = ss.some(function (s) { return s.log && ME.tasks.some(function (t) { return s.log.tasks[t[0]] === 'لم يتم'; }); }) || c.oldPendingTasks > 0;
  var cls = missing ? 'late' : (tasksPend || c.pending ? 'warn' : 'ok');
  return '<div class="cls ' + cls + '" data-fc="' + esc(c.name) + '"><h4>' + esc(c.name) + '</h4><div class="m">' + esc(c.program) + ' • ' + esc(c.level || '') + ' • أسبوع ' + c.week + ' • 👤 ' + esc(c.coaches.join(' • ') || '—') + '</div>' +
    '<div class="line"><span class="k">الحلقات</span>' + (c.sessions.length ? c.sessions.map(function (s) {
      if (s.status === 'cancelled') return '<span class="pill">🚫 ح' + s.n + '</span>';
      if (s.log) return '<span class="pill ' + (s.log.timing === 'في ميعاده' ? 'ok' : 'wait') + '">✓ ح' + s.n + ' (' + s.log.present + '/' + (s.log.present + s.log.absent) + ')' + (s.log.mode === 'بديل' ? ' بديل' : '') + '</span>';
      return '<span class="pill ' + (s.status === 'open' ? 'no' : '') + '">' + (s.status === 'open' ? '⏳' : '…') + ' ح' + s.n + '</span>'; }).join('') : '—') + '</div>' +
    (tasksPend ? '<div class="line"><span class="k">المهام</span><span class="pill wait">في مهام لسه «لم يتم»</span></div>' : '') +

        call('certTplSave', [ME.code, section, reset ? null : t], function (res) { busy(btn); Sound.play('ok'); toast(reset ? 'رجعت للأصلي ✅' : 'اتحفظ ✅'); t = res.tpl; sample.tpl = t; draw(); }, function (er) { busy(btn); failed(er); }); }
    };
  }, function (er) { failed(er); certHome(); });
}
function certClass(cls) {
  loading();
  call('certData', [ME.code, cls], function (d) {
    var kind = ST.certKind || 'mid';
    var fields = function () { return (d.tpl.extra || []).filter(function (x) { return x.type === 'student' && x.kinds.indexOf(kind) !== -1; }); };
    var val = function (s, k) { return (((d.vals || {})[s.code] || {})[kind] || {})[k] || ''; };
    var draw = function () {
      var ready = d.students.filter(function (s) { return certHas(s, kind); }).length, fs = fields();
      var h = '<button class="back" type="button" data-b="1">→ رجوع</button><div class="panel"><h3>📜 ' + esc(d.cls) + '</h3><div class="sub">' + esc(d.program) + ' • ' + esc(d.term) + (d.year ? ' • ' + esc(d.year) : '') + '</div>' +
        '<div class="chips">' + Object.keys(CERT_KINDS).map(function (k) { return '<button type="button" class="chip' + (k === kind ? ' on' : '') + '" data-ck="' + k + '">' + CERT_KINDS[k].short + '</button>'; }).join('') + '</div>' +
        '<div class="sub">المنهج من: ' + esc(kind === 'all' ? [d.sources.mid, d.sources.final].filter(String).join(' + ') || '—' : d.sources[kind] || '— (لسه مفيش تقييم ' + (kind === 'mid' ? 'منتصف' : 'نهائي') + ')') +
          ' • القرآن من اختبار ' + (kind === 'mid' ? 'الميد' : kind === 'final' ? 'الفاينال' : 'الميد والفاينال') + '</div>' +
        '<div class="sub">التقدير: ممتاز من ' + d.bands[0] + '% • جيد جدا من ' + d.bands[1] + '% • جيد من ' + d.bands[2] + '% • أقل = مقبول (بيتغيّر من «الإعدادات»)</div>' +
        '<button class="btn" type="button" data-zip="1"' + (ready ? '' : ' disabled') + '>⬇️ كل شهادات ' + CERT_KINDS[kind].short + ' (' + ready + ' ملف في ZIP)</button></div>';
      h += '<div class="panel"><div class="tw"><table><thead><tr><th style="text-align:right">الطالب</th><th>القرآن</th><th>المنهج</th><th>العام</th>' + fs.map(function (f) { return '<th>' + esc(f.label) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
        d.students.map(function (s, i) { var g = s[kind], okk = certHas(s, kind);
          return '<tr><td style="text-align:right">' + esc(s.name) + '</td><td>' + esc(g.quran || '—') + '</td><td>' + esc(g.content || '—') + '</td><td><b>' + esc(g.overall || '—') + '</b></td>' +
            fs.map(function (f) { return '<td><input type="text" data-xv="' + esc(s.code) + '|' + esc(f.key) + '" value="' + esc(val(s, f.key)) + '" list="cert-gr" style="min-width:90px;padding:6px"></td>'; }).join('') +
            '<td style="white-space:nowrap">' + (okk ? '<button class="btn sm ghost" type="button" data-pv="' + i + '" style="width:auto">👁️</button> <button class="btn sm" type="button" data-dl="' + i + '" style="width:auto">⬇️ PDF</button>' : '<small>لسه</small>') + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + (fs.length ? '<datalist id="cert-gr"><option value="ممتاز"><option value="جيد جدا"><option value="جيد"><option value="مقبول"></datalist><button class="btn sec" type="button" id="xv-save" style="margin-top:8px">💾 حفظ الخانات (' + fs.map(function (f) { return f.label; }).join('، ') + ')</button>' : '') +
        '</div><div id="cert-pv"></div>';
      main(h);
    };
    draw();
    var mm = $('main'), dirty = {};
    mm.oninput = function (e) { var el = e.target; if (el.dataset.xv) dirty[el.dataset.xv] = el.value; };
    mm.onclick = function (e) { var b;
      if (e.target.closest('[data-b]')) { certHome(); return; }
      if ((b = e.target.closest('[data-ck]'))) { kind = ST.certKind = b.dataset.ck; dirty = {}; draw(); return; }
      if (e.target.id === 'xv-save') { var btn = e.target, rows = Object.keys(dirty).map(function (k) { var p = k.split('|'); return { student: p[0], field: p[1], value: dirty[k] }; }); busy(btn, '…');
        call('certValsSave', [ME.code, d.cls, kind, rows], function () { rows.forEach(function (r) { var a = d.vals[r.student] = d.vals[r.student] || {}; (a[kind] = a[kind] || {})[r.field] = r.value; }); dirty = {}; busy(btn); Sound.play('ok'); toast('اتحفظ ✅'); }, function (er) { busy(btn); failed(er); });
        return; }
      if ((b = e.target.closest('[data-pv]'))) { var s = d.students[Number(b.dataset.pv)]; $('cert-pv').innerHTML = '<div class="panel loading">بتترسم…</div>';
        certDraw(d, s, kind).then(function (cv) { $('cert-pv').innerHTML = '<div class="panel"><h3>👁️ ' + esc(s.name) + '</h3><img src="' + cv.toDataURL('image/jpeg', 0.85) + '" style="width:100%;border:1px solid var(--ln);border-radius:8px" alt="الشهادة"></div>'; $('cert-pv').scrollIntoView({ behavior: 'smooth' }); });
        return; }
      if ((b = e.target.closest('[data-dl]'))) { var st = d.students[Number(b.dataset.dl)]; busy(b, '…');
        certDraw(d, st, kind).then(function (cv) { saveBlob(certPdf(cv), certFile(st, kind)); busy(b); Sound.play('ok'); }, function () { busy(b); toast('حصلت مشكلة في الرسم'); });
        return; }
      if ((b = e.target.closest('[data-zip]'))) {
        var list = d.students.filter(function (s) { return certHas(s, kind); }), files = [], i = 0; busy(b, 'بيتجهز 0 / ' + list.length);
        var next = function () {
          if (i >= list.length) { saveBlob(certZip(files), (d.cls + ' - ' + CERT_KINDS[kind].t).replace(/[\\/:*?"<>|]/g, '') + '.zip'); busy(b); Sound.play('ok'); toast('اتحمّل ' + files.length + ' شهادة ✅'); return; }
          var s = list[i++];
          certDraw(d, s, kind).then(function (cv) { return certPdf(cv).arrayBuffer(); }).then(function (ab) { files.push({ name: certFile(s, kind), data: new Uint8Array(ab) }); busy(b, 'بيتجهز ' + i + ' / ' + list.length); setTimeout(next, 0); },
            function () { busy(b); toast('حصلت مشكلة في الرسم'); });
        };
        next(); }
    };
  }, function (er) { failed(er); certHome(); });
}
</script>
