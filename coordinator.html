  <title>مشكاة Teens - بوابة المنسق</title>
  <meta name="theme-color" content="#007baf">
  <style>
    :root {
      --blue: #007baf; --blue-dark: #005f87;
      --green: #b4d437; --green-dark: #9cb82e;
      --bg: #f4f7f6; --text: #333; --muted: #777; --line: #e6eaee;
      --l1: #f0932b; --l2: #3498db; --l3: #27ae60;
      --danger: #e74c3c; --grey: #95a5a6;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg); color: var(--text); margin: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .header-shape {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      height: 160px; border-radius: 0 0 40px 40px;
      position: absolute; top: 0; left: 0; right: 0; z-index: -1;
    }
    .wrapper { padding: 20px 16px 40px; max-width: 640px; margin: 60px auto 0; }
    .card {
      background: #fff; border-radius: 16px; padding: 24px 18px; text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.08); position: relative;
    }
    .logo-box {
      background: #fff; width: 90px; height: 90px; border-radius: 50%;
      margin: -70px auto 15px; padding: 5px; box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }
    .logo-box img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
    h2 { color: var(--blue); margin: 0 0 5px; font-size: 22px; }
    h3 { color: var(--blue); margin: 0 0 10px; font-size: 17px; }
    .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .field { text-align: right; margin-bottom: 14px; }
    .lbl { display: block; font-weight: 600; margin-bottom: 6px; color: var(--blue); font-size: 14px; }
    input[type="text"], select, textarea {
      width: 100%; padding: 12px; border: 2px solid #eef1f5; border-radius: 10px;
      font-size: 16px; background: #f9fbfd; font-family: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--green); background: #fff; outline: none; }
    .btn {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
      color: #fff; border: none; padding: 14px 18px; font-size: 16px; font-weight: bold;
      border-radius: 10px; cursor: pointer; width: 100%; font-family: inherit;
    }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn.secondary { background: #fff; color: var(--blue); border: 2px solid var(--blue); }
    .btn.small { width: auto; padding: 8px 12px; font-size: 13px; }
    .msg { display: none; margin-top: 12px; padding: 10px; border-radius: 8px; font-weight: bold; background: #fdecea; color: var(--danger); }
    .msg.show { display: block; }
    .back-link { display: block; margin-top: 16px; font-size: 13px; color: var(--muted); }
    .hidden { display: none !important; }

    /* ---------- رأس البوابة ---------- */
    .top { color: #fff; margin: -36px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .top h2 { color: #fff; font-size: 19px; margin: 0; }
    .top .sub { font-size: 13px; opacity: .9; }
    .top button { background: rgba(255,255,255,.2); color: #fff; border: none; border-radius: 8px; padding: 7px 10px; font-family: inherit; cursor: pointer; }
    .tabs { display: flex; gap: 6px; background: #fff; padding: 6px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.06); margin-bottom: 14px; }
    .tabs button { flex: 1; border: none; background: transparent; padding: 10px 4px; border-radius: 10px; font-family: inherit; font-size: 14px; color: #555; cursor: pointer; }
    .tabs button.on { background: var(--blue); color: #fff; font-weight: bold; }

    .panel { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.06); margin-bottom: 14px; text-align: right; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 0; }

    /* ---------- لوحة الأسبوع ---------- */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat { background: #fff; border-radius: 12px; padding: 12px 6px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
    .stat b { display: block; font-size: 22px; color: var(--blue); font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    .cls { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); text-align: right; border-right: 5px solid var(--grey); }
    .cls.ok { border-right-color: var(--l3); }
    .cls.warn { border-right-color: var(--l1); }
    .cls.late { border-right-color: var(--danger); }
    .cls-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cls-head h4 { margin: 0; color: var(--blue); font-size: 16px; }
    .coaches { font-size: 12.5px; color: var(--muted); margin: 2px 0 10px; }
    .pill { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .pill.ok { background: #d5f5e3; color: #1e8449; }
    .pill.no { background: #fdecea; color: #c0392b; }
    .pill.wait { background: #fde3c8; color: #a04000; }
    .pill.neutral { background: #eef1f5; color: #555; }
    .line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 13px; }
    .line .k { color: var(--muted); min-width: 64px; }
    .cls-actions { display: flex; gap: 8px; margin-top: 10px; }
    .cls-actions .btn { flex: 1; }

    /* ---------- التقييم 1-3 ---------- */
    .crit { margin-top: 12px; }
    .crit-title { font-weight: 600; font-size: 14px; color: #444; margin-bottom: 6px; }
    .levels { display: flex; gap: 6px; }
    .lvl { flex: 1; border: 2px solid var(--line); border-radius: 10px; background: #f9fbfd; cursor: pointer; font-family: inherit; color: #555; padding: 8px 4px; font-size: 12.5px; }
    .lvl b { display: block; font-size: 18px; }
    .lvl.on[data-v="1"] { background: var(--l1); border-color: var(--l1); color: #fff; }
    .lvl.on[data-v="2"] { background: var(--l2); border-color: var(--l2); color: #fff; }
    .lvl.on[data-v="3"] { background: var(--l3); border-color: var(--l3); color: #fff; }

    /* ---------- تقرير الطالب ---------- */
    .big { display: flex; gap: 10px; margin-bottom: 12px; }
    .big .stat { flex: 1; }
    .bar { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 14px; }
    .bar .name { width: 70px; color: #444; }
    .bar .track { flex: 1; height: 10px; background: #eef1f5; border-radius: 10px; overflow: hidden; }
    .bar .fill { height: 100%; border-radius: 10px; }
    .bar .val { width: 34px; text-align: left; font-weight: bold; font-variant-numeric: tabular-nums; }
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; }
    .s1 { color: var(--l1); font-weight: bold; } .s2 { color: var(--l2); font-weight: bold; } .s3 { color: var(--l3); font-weight: bold; }
    .note { background: #f6f9fc; border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 13.5px; }
    .note small { color: var(--muted); }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 12px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px;
      z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90%; text-align: center;
    }
    .toast.show { opacity: .95; }
    .loading { text-align: center; color: var(--muted); padding: 20px; }
  </style>
</head>

            var t = c.currentTime + i * 0.1, o = c.createOscillator(), g = c.createGain();
            o.type = kind === 'error' ? 'square' : 'sine'; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(kind === 'error' ? 0.06 : 0.15, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
            o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.2);
          });
        } catch (e) {}
      }
    };

    // ---------- أدوات ----------
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    var toastTimer;
    function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2800); }
    function busy(btn, text) { if (!btn.dataset.label) btn.dataset.label = btn.textContent; btn.disabled = !!text; btn.textContent = text || btn.dataset.label; }
    function call(fn, args, ok, fail) {
      fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
        .then(function (r) { return r.json(); })
        .then(function (res) { if (res.ok) ok(res.data); else (fail || defaultFail)(new Error(res.error)); })
        .catch(function () { (fail || defaultFail)(new Error('تعذر الاتصال، اتأكد من الإنترنت وجرب تاني')); });
    }
    function defaultFail(err) { Sound.play('error'); toast('حدث خطأ: ' + err.message); }
    function fillSelect(sel, items, placeholder) {
      sel.innerHTML = (placeholder ? '<option value="">' + placeholder + '</option>' : '') +
        items.map(function (x) { return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join('');
    }
    function levelsHTML(key, current) {
      return LEVELS.map(function (l, k) {
        var v = k + 1;
        return '<button type="button" class="lvl' + (current === v ? ' on' : '') + '" data-c="' + key + '" data-v="' + v + '"><b>' + v + '</b>' + l + '</button>';
      }).join('');
    }

    // ---------- الدخول ----------
    function login() {
      var code = $('coordCode').value.trim();
      var msg = $('login-msg');
      if (!code) { msg.textContent = 'من فضلك أدخل الكود'; msg.classList.add('show'); Sound.play('error'); return; }
      var btn = $('login-btn'); busy(btn, 'جاري التحقق… ⏳'); msg.classList.remove('show');
      call('verifyCoordinator', [code], function (res) {
        busy(btn);
        if (!res.success) { msg.textContent = res.message; msg.classList.add('show'); Sound.play('error'); return; }
        Sound.play('success');
        state.code = code; state.name = res.name; state.classes = res.classes; state.week = res.week;
        $('hello').textContent = 'أهلاً، ' + res.name;
        $('hello-sub').textContent = res.classes.length + ' حلقة • الأسبوع الحالي: ' + (res.week || '—');
        fillSelect($('weekSelect'), res.weeks);
        $('weekSelect').value = res.week;
        fillSelect($('visitClass'), res.classes, 'اختار الفصل…');
        fillSelect($('repClass'), res.classes, 'اختار الفصل…');
        fillSelect($('repStudent'), [], 'اختار الفصل الأول');
        fillSelect($('visitCoach'), [], 'اختار الفصل الأول');
        renderVisitForm();
        $('view-login').classList.add('hidden'); $('view-app').classList.remove('hidden');
        loadDashboard();
      }, function (err) { busy(btn); msg.textContent = 'حدث خطأ: ' + err.message; msg.classList.add('show'); Sound.play('error'); });
    }
    function logout() { state = { code: '', name: '', classes: [], week: '', visit: {} }; $('coordCode').value = ''; $('view-app').classList.add('hidden'); $('view-login').classList.remove('hidden'); }

    function showTab(tab) {
      document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
      ['dash', 'visit', 'report'].forEach(function (t) { $('tab-' + t).classList.toggle('hidden', t !== tab); });
      window.scrollTo(0, 0);
    }

    // ---------- لوحة الأسبوع ----------
    function loadDashboard() {
      $('classes-list').innerHTML = '<div class="loading">جاري التحميل…</div>';
      $('stats').innerHTML = '';
      call('coordDashboard', [state.code, $('weekSelect').value], renderDashboard,
        function (err) { $('classes-list').innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; });
    }
    function renderDashboard(d) {
      var list = d.classes;
      if (!list.length) { $('classes-list').innerHTML = '<div class="empty">مفيش حلقات مسجلة ليك.</div>'; return; }
      var submitted = list.filter(function (c) { return c.submitted; }).length;
      var pendingTasks = list.filter(function (c) { return c.log && TASKS.some(function (t) { return c.log.tasks[t[0]] !== 'تم'; }); }).length;
      var present = 0, total = 0;
      list.forEach(function (c) { if (c.log) { present += c.log.present; total += c.log.present + c.log.absent; } });
      $('stats').innerHTML =
        '<div class="stat"><b>' + submitted + '/' + list.length + '</b><span>حلقات بعتت</span></div>' +
        '<div class="stat"><b>' + pendingTasks + '</b><span>مهام مستنية</span></div>' +
        '<div class="stat"><b>' + (total ? Math.round(present / total * 100) + '%' : '—') + '</b><span>نسبة الحضور</span></div>';

      // اللي محتاج متابعة الأول
      list = list.slice().sort(function (a, b) { return rank(a) - rank(b); });
      $('classes-list').innerHTML = list.map(function (c) {
        var st = !c.submitted ? 'late' : (TASKS.some(function (t) { return c.log.tasks[t[0]] !== 'تم'; }) ? 'warn' : 'ok');
        var head = c.submitted ? '<span class="pill ok">✅ اتبعت</span>' : '<span class="pill no">⏳ لسه ما اتبعتش</span>';
        var att = c.log ? '<span class="pill neutral">حاضر ' + c.log.present + '</span><span class="pill neutral">غائب ' + c.log.absent + '</span><span class="pill neutral">من ' + c.students + '</span>'
                        : '<span class="pill neutral">' + c.students + ' طالب</span>';
        var tasks = c.log ? TASKS.map(function (t) { var ok = c.log.tasks[t[0]] === 'تم'; return '<span class="pill ' + (ok ? 'ok' : 'wait') + '">' + (ok ? '✓ ' : '⏳ ') + t[1] + '</span>'; }).join('')
                          : '<span class="pill neutral">—</span>';
        var proj = c.project ? esc(c.project) + ' ' + ['لم يبدأ', 'جاري', 'سلّم', 'متعثر'].map(function (s) {
                     var n = c.projectCounts[s] || 0; if (!n) return '';
                     var cls = s === 'سلّم' ? 'ok' : s === 'متعثر' ? 'no' : s === 'جاري' ? 'neutral' : 'neutral';
                     return '<span class="pill ' + cls + '">' + s + ' ' + n + '</span>';
                   }).join('') : '<span class="pill neutral">مفيش مشروع مفتوح</span>';
        var visit = c.lastVisit ? esc(c.lastVisit.week) + ' — ' + esc(c.lastVisit.by) : 'مفيش زيارات لسه';
        return '<div class="cls ' + st + '">' +
          '<div class="cls-head"><h4>' + esc(c.name) + '</h4>' + head + '</div>' +
          '<div class="coaches">👤 ' + esc(c.coaches.join(' • ') || '—') + '</div>' +
          '<div class="line"><span class="k">الحضور</span>' + att + '</div>' +
          '<div class="line"><span class="k">المهام</span>' + tasks + '</div>' +
          '<div class="line"><span class="k">المشروع</span>' + proj + '</div>' +
          '<div class="line"><span class="k">آخر زيارة</span>' + visit + '</div>' +
          '<div class="cls-actions"><button class="btn secondary small" type="button" data-go="visit" data-cls="' + esc(c.name) + '">🏫 زيارة</button>' +
          '<button class="btn secondary small" type="button" data-go="report" data-cls="' + esc(c.name) + '">👤 تقارير الطلاب</button></div>' +
        '</div>';
      }).join('');
    }
    function rank(c) { if (!c.submitted) return 0; return TASKS.some(function (t) { return c.log.tasks[t[0]] !== 'تم'; }) ? 1 : 2; }

    // ---------- زيارة فصل ----------
    function renderVisitForm() {
      $('visit-criteria').innerHTML = VISIT_CRITERIA.map(function (c) {
        return '<div class="crit"><div class="crit-title">' + c.title + '</div><div class="levels">' + levelsHTML(c.key, state.visit[c.key]) + '</div></div>';
      }).join('');
    }
    function loadClassPeople(cls, coachSel, studentSel) {
      if (!cls) { if (coachSel) fillSelect(coachSel, [], 'اختار الفصل الأول'); if (studentSel) fillSelect(studentSel, [], 'اختار الفصل الأول'); return; }
      if (coachSel) fillSelect(coachSel, [], 'جاري التحميل…');
      if (studentSel) fillSelect(studentSel, [], 'جاري التحميل…');
      call('coordClassStudents', [state.code, cls], function (res) {
        if (coachSel) fillSelect(coachSel, res.coaches.length ? res.coaches : ['—']);
        if (studentSel) fillSelect(studentSel, res.students, res.students.length ? 'اختار الطالب…' : 'مفيش طلاب');
      });
    }
    function saveVisit() {
      var cls = $('visitClass').value;
      if (!cls) { Sound.play('error'); toast('اختار الفصل'); return; }
      var missing = VISIT_CRITERIA.filter(function (c) { return !state.visit[c.key]; });
      if (missing.length) { Sound.play('error'); toast('قيّم: ' + missing.map(function (c) { return c.title.replace(/^\S+\s/, ''); }).join('، ')); return; }
      var btn = $('visit-save'); busy(btn, 'جاري الحفظ… ⏳');
      call('saveVisit', [state.code, cls, { scores: state.visit, notes: $('visitNotes').value.trim(), coach: $('visitCoach').value }], function () {
        busy(btn); Sound.play('success'); toast('تم حفظ الزيارة ✅');
        state.visit = {}; $('visitNotes').value = ''; renderVisitForm();
      }, function (err) { busy(btn); defaultFail(err); });
    }

    // ---------- تقرير طالب ----------
    function scoreCell(v) { return v ? '<span class="s' + v + '">' + v + '</span>' : '—'; }
    function barColor(v) { return v >= 2.5 ? 'var(--l3)' : v >= 1.75 ? 'var(--l2)' : 'var(--l1)'; }
    function loadReport() {
      var cls = $('repClass').value, st = $('repStudent').value;
      if (!cls || !st) { Sound.play('error'); toast('اختار الفصل والطالب'); return; }
      $('report').innerHTML = '<div class="panel loading">جاري التحميل…</div>';
      call('studentReport', [state.code, cls, st], renderReport,
        function (err) { $('report').innerHTML = '<div class="panel empty">' + esc(err.message) + '</div>'; });
    }
    function renderReport(r) {
      var a = r.attendance;
      var bars = Object.keys(EVAL_LABELS).map(function (k) {
        var v = r.averages[k];
        return '<div class="bar"><span class="name">' + EVAL_LABELS[k] + '</span><div class="track"><div class="fill" style="width:' + (v ? v / 3 * 100 : 0) + '%;background:' + barColor(v || 0) + '"></div></div><span class="val">' + (v == null ? '—' : v) + '</span></div>';
      }).join('');
      var rows = r.weeks.slice().reverse().map(function (w) {
        return '<tr><td>' + esc(w.week) + '</td><td>' + esc(w.attendance) + '</td><td>' + scoreCell(w.quran) + '</td><td>' + scoreCell(w.tajweed) + '</td><td>' + scoreCell(w.interaction) + '</td><td>' + scoreCell(w.behavior) + '</td></tr>';
      }).join('');
      var notes = r.notes.length ? r.notes.map(function (n) { return '<div class="note">' + esc(n.text) + ' <small>— ' + esc(n.week) + '، ' + esc(n.coach) + '</small></div>'; }).join('')
                                 : '<div class="empty">مفيش ملاحظات.</div>';
      var proj = '<div class="empty">مفيش مشروع مفتوح للفصل ده.</div>';
      if (r.project) {
        var stCls = r.project.status === 'سلّم' ? 'ok' : r.project.status === 'متعثر' ? 'no' : 'neutral';
        var dims = Object.keys(PROJ_LABELS).filter(function (k) { return r.project.scores[k]; }).map(function (k) {
          return '<span class="pill neutral">' + PROJ_LABELS[k] + ': ' + scoreCell(r.project.scores[k]) + '</span>';
        }).join('');
        proj = '<div class="line"><b>' + esc(r.project.name) + '</b><span class="pill ' + stCls + '">' + esc(r.project.status) + '</span>' +
               (r.project.due ? '<span class="pill neutral">التسليم: ' + esc(r.project.due) + '</span>' : '') + '</div>' +
               (dims ? '<div class="line">' + dims + '</div>' : '');
      }
      $('report').innerHTML =
        '<div class="panel"><h3>👤 ' + esc(r.student) + ' <span style="color:var(--muted);font-size:14px;font-weight:normal">— ' + esc(r.cls) + '</span></h3>' +
          '<div class="big">' +
            '<div class="stat"><b>' + (r.attendanceRate == null ? '—' : r.attendanceRate + '%') + '</b><span>نسبة الحضور</span></div>' +
            '<div class="stat"><b>' + r.total + '</b><span>أسابيع متسجلة</span></div>' +
            '<div class="stat"><b>' + a['غائب'] + '</b><span>غياب</span></div>' +
          '</div>' +
          '<div class="line"><span class="pill neutral">حاضر ' + a['حاضر'] + '</span><span class="pill neutral">تعويضي ' + a['تعويضي'] + '</span><span class="pill neutral">مستأذن ' + a['مستأذن'] + '</span></div>' +
        '</div>' +
        '<div class="panel"><h3>📈 متوسط التقييم (من 3)</h3>' + bars + '</div>' +
        '<div class="panel"><h3>🎯 المشروع</h3>' + proj + '</div>' +
        '<div class="panel"><h3>🗓️ آخر الأسابيع</h3>' + (rows ? '<div class="tbl-wrap"><table><thead><tr><th>الأسبوع</th><th>الحضور</th><th>القرآن</th><th>التجويد</th><th>التفاعل</th><th>السلوك</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty">مفيش تقييمات لسه.</div>') + '</div>' +
        '<div class="panel"><h3>📝 ملاحظات المربين</h3>' + notes + '</div>';
      Sound.play('tap');
    }

    // ---------- ربط ----------
    $('login-btn').addEventListener('click', login);
    $('coordCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
    $('logout-btn').addEventListener('click', logout);
    $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button[data-tab]'); if (b) { Sound.play('tap'); showTab(b.dataset.tab); } });
    $('weekSelect').addEventListener('change', loadDashboard);
    $('classes-list').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-go]'); if (!b) return;
      Sound.play('tap');
      if (b.dataset.go === 'visit') { $('visitClass').value = b.dataset.cls; loadClassPeople(b.dataset.cls, $('visitCoach')); showTab('visit'); }
      else { $('repClass').value = b.dataset.cls; $('report').innerHTML = ''; loadClassPeople(b.dataset.cls, null, $('repStudent')); showTab('report'); }
    });
    $('visitClass').addEventListener('change', function () { loadClassPeople(this.value, $('visitCoach')); });
    $('repClass').addEventListener('change', function () { $('report').innerHTML = ''; loadClassPeople(this.value, null, $('repStudent')); });
    $('repStudent').addEventListener('change', function () { if (this.value) loadReport(); });
    $('rep-btn').addEventListener('click', loadReport);
    $('visit-criteria').addEventListener('click', function (e) {
      var b = e.target.closest('.lvl'); if (!b) return;
      state.visit[b.dataset.c] = +b.dataset.v; renderVisitForm(); Sound.play('tap');
    });
    $('visit-save').addEventListener('click', saveVisit);
  </script>
</body>
</html>
